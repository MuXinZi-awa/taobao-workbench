<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>优化管理工作台</title>
<style>
:root { --bg:#F5EFE4; --card:#FBF7EE; --side:#EFE8DB; --text:#2A2622; --text-l:#4A433C;
  --text-m:#6B6158; --border:#D8CFBE; --accent:#537D96; --accent-h:#3F6179;
  --accent-l:rgba(83,125,150,.08); --green:#4A6B4A; --r:6px;
  --font-ui:system-ui,"Microsoft YaHei",sans-serif; --font-mono:Consolas,monospace; }
html { font-size:14px; }
input, textarea, select { background:var(--card); color:var(--text); caret-color:var(--text); }
input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus {
  -webkit-box-shadow:0 0 0 30px var(--card) inset !important;
  -webkit-text-fill-color:var(--text) !important; }
input::placeholder { color:var(--text-m); opacity:.8; }
* { box-sizing:border-box; }
body { font-family:var(--font-ui); background:var(--bg); margin:0; color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; font-size:14px; line-height:1.55; }
.topbar { display:flex; align-items:center; padding:4px 12px; background:var(--side); border-bottom:.5px solid var(--border); flex-shrink:0; }
.topbar .t { font-weight:500; font-size:1rem; }
.topbar .right { margin-left:auto; display:flex; gap:4px; }
.iconbtn { border:.5px solid var(--border); background:transparent; border-radius:var(--r); width:24px; height:24px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-l); flex-shrink:0; padding:0; }
.iconbtn:hover { background:var(--accent); color:#FFFDF7; }
.iconbtn svg { width:14px; height:14px; }
.main { flex:1; display:flex; min-height:0; }
.col-side { width:150px; border-right:.5px solid var(--border); background:var(--side); padding:6px 4px; overflow-y:auto; flex-shrink:0; }
.col-side .cap { font-size:11px; color:var(--text-m); padding:2px 6px; }
.plugin { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:var(--r); font-size:0.93rem; color:var(--text-l); cursor:pointer; margin-bottom:3px; }
.plugin:hover { background:var(--accent); color:#FFFDF7; }
.plugin.active { background:var(--accent); color:#FFFDF7; }
.plugin svg { width:17px; height:17px; flex-shrink:0; opacity:.85; }
.plugin { font-size:13px; }
.col-main { flex:1; display:flex; flex-direction:column; min-width:0; }
.viewtab { display:flex; gap:2px; padding:4px 10px 0; flex-shrink:0; }
.viewtab .vt { padding:3px 12px; font-size:0.88rem; cursor:pointer; color:var(--text-m); border-radius:var(--r) var(--r) 0 0; }
.viewtab .vt.active { background:var(--card); color:var(--accent-h); font-weight:500; }
.pane { flex:1; min-height:0; display:none; }
.pane.active { display:flex; flex-direction:column; }
#logPane { padding:0 10px 8px; }
.logbox { flex:1; background:var(--card); border:.5px solid var(--border); border-radius:var(--r); padding:10px 12px; font-family:var(--font-mono); font-size:0.9rem; color:var(--text-l); overflow-y:auto; white-space:pre-wrap; line-height:1.7; }
#prevPane { padding:0 10px 8px; }
.prevhead { display:flex; align-items:center; padding:3px 4px; font-size:0.88rem; color:var(--text-l); flex-shrink:0; }
#wsBody { position:relative; overflow:hidden; }
.prevbody { flex:1; background:var(--card); border:.5px solid var(--border); border-radius:var(--r); overflow:auto; display:flex; flex-direction:column; }
.prevbody img { max-width:100%; height:auto; } .prevbody video { max-width:100%; max-height:100%; margin:auto; }
.prevbody pre { margin:0; padding:8px 10px; font-family:var(--font-mono); font-size:12px; white-space:pre-wrap; }
.prevbody table { border-collapse:collapse; font-size:12px; width:100%; }
.prevbody th, .prevbody td { border:.5px solid var(--border); padding:3px 8px; text-align:left; }
.prevbody th { background:var(--side); }
.prevbody iframe { flex:1; border:none; }
.col-desk { width:260px; border-left:.5px solid var(--border); background:var(--card); display:flex; flex-direction:column; flex-shrink:0; transition:width .15s; overflow:hidden; }
.col-desk.closed { width:0; border-left:none; }
.desk-search { position:relative; padding:6px 8px 3px; }
.desk-search input { width:100%; border:.5px solid var(--border); border-radius:var(--r); padding:4px 8px; font-size:0.88rem; background:#FFFDF7; outline:none; }
.suggest { position:absolute; top:calc(100% - 1px); left:8px; right:8px; background:var(--card); border:.5px solid var(--border); border-radius:var(--r); max-height:200px; overflow-y:auto; display:none; z-index:30; }
.suggest .it { padding:4px 8px; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:5px; }
.suggest .it:hover { background:var(--accent-l); }
.suggest .it .tp { font-size:10px; color:var(--text-m); margin-left:auto; }
.desk-head { display:flex; align-items:center; gap:4px; padding:4px 8px; border-top:.5px solid var(--border); white-space:nowrap; }
.desk-head .dh { font-size:0.88rem; font-weight:500; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.desk-head .cnt { font-size:0.8rem; color:var(--text-m); flex-shrink:0; }
.desk-tools { display:flex; gap:3px; padding:3px 8px; align-items:center; flex-shrink:0; position:relative; }
.ddbtn { display:flex; align-items:center; gap:3px; border:.5px solid var(--border); background:transparent; border-radius:var(--r); padding:3px 8px; font-size:0.8rem; color:var(--text-l); cursor:pointer; font-family:var(--font-ui); }
.ddbtn:hover { background:var(--accent-l); }
.ddbtn svg { width:11px; height:11px; }
.dropdown { position:absolute; top:calc(100% + 1px); background:var(--card); border:.5px solid var(--border); border-radius:var(--r); min-width:110px; display:none; z-index:35; }
.dropdown.open { display:block; }
.dropdown .opt { padding:4px 10px; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:5px; }
.dropdown .opt:hover { background:var(--accent-l); }
.dropdown .opt.on { color:var(--accent-h); font-weight:500; }
.desk-info { font-size:0.78rem; color:var(--text-m); padding:1px 8px 3px; border-bottom:.5px solid var(--border); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex-shrink:0; }
.desk-files { flex:1; overflow-y:auto; padding:3px; }
.file { display:flex; align-items:center; gap:7px; padding:4px 7px; border-radius:3px; font-size:0.93rem; color:var(--text); cursor:pointer; }
.file:hover { background:var(--accent-l); }
.file svg { width:13px; height:13px; flex-shrink:0; opacity:.8; }
.file .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.file .sz { color:var(--text-m); font-size:0.75rem; flex-shrink:0; }
.modal-mask { position:absolute; inset:0; background:rgba(42,38,34,.3); display:none; z-index:40; }
.modal { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:min(760px,94vw); height:min(640px,88vh); background:var(--card); border:.5px solid var(--border); border-radius:var(--r); display:none; flex-direction:column; z-index:41; box-shadow:0 8px 30px rgba(42,38,34,.12); }
.modal.open { display:flex; }
.modal-head { display:flex; align-items:center; padding:6px 12px; border-bottom:.5px solid var(--border); }
.modal-head .mt { font-weight:500; }
.modal-head .x { margin-left:auto; border:none; background:transparent; font-size:18px; cursor:pointer; color:var(--text-m); line-height:1; padding:0 4px; }
.modal-body { flex:1; display:flex; min-height:0; }
.set-nav { width:110px; border-right:.5px solid var(--border); padding:8px 4px; background:var(--side); flex-shrink:0; }
.set-nav .item { display:flex; align-items:center; gap:6px; padding:6px 8px; font-size:13px; color:var(--text-l); cursor:pointer; border-radius:var(--r); margin-bottom:2px; }
.set-nav .item svg { width:14px; height:14px; flex-shrink:0; opacity:.7; }
.set-nav .item.active { background:var(--accent); color:#FFFDF7; }
.set-content { flex:1; padding:10px 12px; overflow-y:auto; }
.set-content h3 { font-size:17px; margin:0 0 4px; font-weight:600; }
.set-content .pgdesc { font-size:12px; color:var(--text-m); margin:0 0 18px; line-height:1.6; }
.set-content .desc { margin-bottom:20px; line-height:1.6; }
.set-block { margin-bottom:30px; }
.set-block .bt { font-size:14px; font-weight:600; margin:0 0 8px; color:var(--text); }
.set-block .bd { font-size:12px; color:var(--text-m); margin:0 0 10px; line-height:1.6; }
.set-pgtitle { font-size:15px; font-weight:500; margin:0 0 3px; }
.set-pgdesc { font-size:12px; color:var(--text-m); margin:0 0 14px; }
.set-content .desc { font-size:11px; color:var(--text-m); margin-bottom:8px; }
.plug-item { display:flex; align-items:center; gap:8px; padding:6px 8px; border:.5px solid var(--border); border-radius:var(--r); margin-bottom:6px; cursor:pointer; }
.plug-item:hover { border-color:var(--accent); }
.plug-item .pn { font-size:13px; }
.plug-item .pv { font-size:11px; color:var(--text-m); }
.plug-item .pd { font-size:11px; color:var(--text-m); }
.plug-item .tag { font-size:10px; padding:1px 7px; border-radius:10px; background:var(--accent-l); color:var(--accent-h); margin-left:auto; flex-shrink:0; }
.dropzone { border:1px dashed var(--border); border-radius:var(--r); padding:10px; text-align:center; font-size:12px; color:var(--text-m); margin-bottom:8px; cursor:pointer; }
.dropzone:hover { border-color:var(--accent); color:var(--accent-h); }
.plug-detail .row { display:flex; justify-content:space-between; padding:3px 0; border-bottom:.5px solid rgba(0,0,0,.05); font-size:12px; gap:10px; }
.plug-detail .k { color:var(--text-m); flex-shrink:0; }
.about-row { display:flex; justify-content:space-between; padding:4px 0; border-bottom:.5px solid rgba(0,0,0,.05); font-size:12px; }
.about-row .k { color:var(--text-m); }
</style>
<style id="themeCss">
body[data-theme="fresh"] { --bg:#EEF2F7; --card:#FAFCFE; --side:#E2E9F0; --text:#1B2A3A; --text-l:#33475C; --text-m:#5A6E82; --border:#C9D6E2; }

body[data-theme="deepseek"] { --bg:#F4F4F5; --card:#FAFAFA; --side:#EDEDEF; --text:#1A1A1A; --text-l:#66666B; --text-m:#8E8E95; --border:rgba(0,0,0,.08); --accent:#1A1A1A; --accent-h:#000000; }
body[data-theme="dsh"] { --bg:#F3F1EC; --card:#FAF9F5; --side:#EBE8E1; --text:#3A362F; --text-l:#585249; --text-m:#7E776C; --border:rgba(90,80,60,.14); --accent:#5E7C9E; --accent-h:#496384; }

/* ===== 主题组件级覆盖（形态层——delve/莫兰迪全局视觉，纸色默认不动） ===== */
body[data-theme="deepseek"] .topbar,
body[data-theme="deepseek"] .col-side,
body[data-theme="deepseek"] .col-desk { border-color:rgba(0,0,0,.06); }
body[data-theme="deepseek"] .prevbody,
body[data-theme="deepseek"] .logbox,
body[data-theme="deepseek"] .modal,
body[data-theme="deepseek"] .dropdown,
body[data-theme="deepseek"] .suggest { background:var(--card); border-color:rgba(0,0,0,.06); border-radius:12px; box-shadow:0 1px 2px rgba(0,0,0,.03),0 4px 16px rgba(0,0,0,.05); }
body[data-theme="deepseek"] .plugin,
body[data-theme="deepseek"] .iconbtn,
body[data-theme="deepseek"] .vt,
body[data-theme="deepseek"] .item { border-radius:8px; transition:background .15s,color .15s; }
body[data-theme="deepseek"] .plugin.active,
body[data-theme="deepseek"] .iconbtn:hover { background:#1A1A1A; color:#fff; box-shadow:0 2px 8px rgba(0,0,0,.18); }
body[data-theme="deepseek"] .col-desk { background:var(--card); }
body[data-theme="deepseek"] .desk-search input,
body[data-theme="deepseek"] input,
body[data-theme="deepseek"] .prevbody pre { border-radius:8px; }
body[data-theme="deepseek"] .viewtab .vt.active { background:var(--card); }
body[data-theme="deepseek"] .set-block,
body[data-theme="deepseek"] .about-row { border-color:rgba(0,0,0,.07); }

body[data-theme="dsh"] .topbar,
body[data-theme="dsh"] .col-side,
body[data-theme="dsh"] .col-desk { border-color:rgba(90,80,60,.10); }
body[data-theme="dsh"] .prevbody,
body[data-theme="dsh"] .logbox,
body[data-theme="dsh"] .modal,
body[data-theme="dsh"] .dropdown,
body[data-theme="dsh"] .suggest { background:var(--card); border-color:rgba(120,105,85,.12); border-radius:12px; box-shadow:0 1px 3px rgba(90,75,55,.05),0 10px 28px rgba(90,75,55,.08); }
body[data-theme="dsh"] .plugin,
body[data-theme="dsh"] .iconbtn,
body[data-theme="dsh"] .item { border-radius:8px; transition:background .18s,color .18s; }
body[data-theme="dsh"] .plugin.active,
body[data-theme="dsh"] .iconbtn:hover { background:#5E7C9E; color:#fff; box-shadow:0 2px 10px rgba(94,124,158,.25); }
body[data-theme="dsh"] .col-desk { background:var(--card); }
body[data-theme="dsh"] .desk-search input,
body[data-theme="dsh"] input,
body[data-theme="dsh"] .prevbody pre { border-radius:8px; }
body[data-theme="dsh"] .viewtab .vt.active { background:var(--card); }
body[data-theme="dsh"] .set-block,
body[data-theme="dsh"] .about-row { border-color:rgba(90,80,60,.10); }body[data-theme="warm"] { --bg:#FBF3E4; --card:#FFF9EC; --side:#F3E7CF; --text:#3A2E1E; --text-l:#5A4A32; --text-m:#7A6A52; --border:#E2D2B4; }
</style></head>
<body>
<div class="topbar"><span class="t">优化管理工作台</span>
  <div class="right">
    <button class="iconbtn" id="deskToggle" onclick="toggleDesk()" title="收起/展开书桌">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 2h12v12H2z"/><path d="M10 5.5v5l-3-2.5z" fill="currentColor" stroke="none"/></svg></button>
    <button class="iconbtn" onclick="openSettings('plugins')" title="设置">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4"/></svg></button>
  </div>
</div>
<div class="main">
  <div class="col-side"><div class="cap">已装插件</div><div id="plugins"></div></div>
  <div class="col-main">
    <div class="viewtab"><div class="vt active" data-v="ws" onclick="switchView('ws')">工作区</div><div class="vt" data-v="log" onclick="switchView('log')">运行日志</div><div class="vt" data-v="prev" onclick="switchView('prev')">预览</div></div>
    <div class="pane" id="logPane"><div class="prevhead"><span style="font-size:12px;color:var(--text-l)">运行日志</span><span style="margin-left:8px;font-size:11px;color:var(--text-m)" id="logf">tg_panel.log（推广批操作）</span><span style="margin-left:auto;display:flex;gap:6px;align-items:center;font-size:10px;color:var(--text-m)"><button class="iconbtn" id="logPauseBtn" onclick="logPause()" style="width:auto;padding:0 6px;font-size:10px" title="暂停/继续刷新">⏸</button><button class="iconbtn" onclick="logOpenAll()" style="width:auto;padding:0 6px;font-size:10px" title="显示全部日志">全部</button>自动跟随</span></span></div><div class="logbox" id="log" style="font-family:var(--font-mono);font-size:11px;white-space:pre-wrap;overflow:auto;padding:8px 12px;line-height:1.5">加载日志…</div></div>
    <div class="pane active" id="wsPane"><div class="prevhead"><span id="wsName">插件工作区</span></div><div id="wsEmpty" style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-m);font-size:12px">点左侧插件打开它的工作面板</div><div class="prevbody" id="wsBody" style="padding:4px"></div></div>
    <div class="pane" id="prevPane">
  <div id="auditMode" style="display:none;flex-direction:column;flex:1;min-height:0">
    <div style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--card,#fbf9f4);border:.5px solid var(--border,#ddd);border-radius:8px;margin-bottom:6px;flex-wrap:wrap">
      <b id="adProg" style="font-size:12px">审核 0/0</b>
      <span id="adLh2" style="font-size:12px;font-weight:600">—</span>
      <span id="adType2" style="font-size:11px;color:var(--text-l,#888)"></span>
      <span style="margin-left:auto;display:flex;gap:5px">
        <button onclick="adNav(-1)" style="padding:3px 10px;border:.5px solid var(--border);border-radius:6px;cursor:pointer;background:transparent;color:var(--text,#333)">◀</button>
        <button onclick="adNav(1)" style="padding:3px 10px;border:.5px solid var(--border);border-radius:6px;cursor:pointer;background:transparent;color:var(--text,#333)">▶</button>
        <label style="font-size:11px;display:flex;align-items:center;gap:3px"><input type="checkbox" id="adForce" onchange="adForceTg()">force</label>
      </span>
    </div>
    <div id="adPic2" style="flex:1;display:flex;align-items:center;justify-content:center;background:var(--bg,#f5f5f2);border:.5px solid var(--border,#ddd);border-radius:8px;min-height:200px;overflow:hidden"></div>
    <div style="display:flex;align-items:center;gap:8px;padding:8px 4px;flex-wrap:wrap">
      <button id="aOk" onclick="adMark('放行')" style="padding:7px 18px;border-radius:8px;border:.5px solid #2a7a3a;color:#2a7a3a;background:transparent;cursor:pointer;font-size:13px">✅ 放行</button>
      <button id="aFix" onclick="adMark('送修')" style="padding:7px 18px;border-radius:8px;border:.5px solid #b8860b;color:#b8860b;background:transparent;cursor:pointer;font-size:13px">🛠 水印-AI送修</button>
      <button id="aSrc" onclick="adMark('换源')" style="padding:7px 18px;border-radius:8px;border:.5px solid #4a7cf7;color:#4a7cf7;background:transparent;cursor:pointer;font-size:13px">🔄 质量差-换源</button>
      <span id="adMarkSt" style="font-size:12px;color:var(--text-l,#888)"></span>
      <span style="margin-left:auto;display:flex;gap:6px;align-items:center">
        <span id="adSkipInfo" style="font-size:11px;color:#999"></span>
        <button onclick="adConfirm()" style="padding:7px 20px;border-radius:8px;background:#2a7a3a;color:#fff;cursor:pointer;border:0;font-size:13px;font-weight:600">✔ 确认提交本批</button>
      </span>
    </div>
  </div>

      <div class="prevhead"><span id="prevName">预览</span></div>
      <div class="prevbody" id="prevBody"><div style="margin:auto;color:var(--text-m);font-size:12px">双击书桌里的文件，在这里预览（图片可缩放拖动 / pdf 转图 / csv 表格 / md 文档）</div></div>
    </div>
  </div>
  <div class="col-desk" id="desk">
    <div class="desk-search">
      <input id="searchInput" placeholder="搜索工作台" autocomplete="off">
      <div class="suggest" id="suggest"></div>
    </div>
    <div class="desk-head"><span class="dh" id="deskDir">文件书桌</span><span class="cnt" id="deskCount"></span></div>
    <div class="desk-tools">
      <button class="ddbtn" id="openFolderBtn" onclick="openFolder()" title="在系统文件管理器中打开当前目录">打开</button>
      <button class="ddbtn" id="ftBtn">过滤<span style="font-size:9px">▾</span></button>
      <button class="ddbtn" id="sortBtn">时间<span style="font-size:9px">▾</span></button>
      <div class="dropdown" id="ftMenu">
        <div class="opt" data-v="">全部类型</div><div class="opt" data-v="img">图片</div><div class="opt" data-v="txt">文本</div><div class="opt" data-v="vid">视频</div>
      </div>
      <div class="dropdown" id="sortMenu">
        <div class="opt" data-v="time">修改时间</div><div class="opt" data-v="nameA">名称 A→Z</div><div class="opt" data-v="nameZ">名称 Z→A</div><div class="opt" data-v="size">文件大小</div><div class="opt" data-v="type">文件类型</div>
      </div>
    </div>
    <div class="desk-info" id="deskInfo"></div>
    <div class="desk-files" id="deskFiles"></div>
  </div>
</div>
<div class="modal-mask" id="mask" onclick="closeSettings()"></div>
<div class="modal" id="settingsModal">
  <div class="modal-head"><span class="mt">设置</span><button class="x" onclick="closeSettings()">×</button></div>
  <div class="modal-body">
    <div class="set-nav">
      <div class="item active" data-page="plugins" onclick="openSetPage('plugins')"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>插件</div>
      <div class="item" data-page="interface" onclick="openSetPage('interface')"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="2" width="12" height="12" rx="1"/><circle cx="5" cy="5" r="1.4"/><path d="M4 13l4.5-5 2.5 2.5 2-2"/></svg>界面</div>

<script>
const API='http://127.0.0.1:8900';

const ICO={plug:'<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.5" y="1.5" width="4.6" height="4.6" rx="1"/><rect x="7.9" y="1.5" width="4.6" height="4.6" rx="1"/><rect x="1.5" y="7.9" width="4.6" height="4.6" rx="1"/><rect x="7.9" y="7.9" width="4.6" height="4.6" rx="1"/></svg>',dir:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M1.5 3.5h4l1.5 2h7.5v7h-13z"/></svg>',img:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><circle cx="5.5" cy="6.5" r="1.3"/><path d="M2.5 13l4-4.5 3 3 2-2 2 2.5"/></svg>',pdf:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 1.5h7l3 3v10h-10z"/><path d="M10 1.5v3h3"/><text x="4.5" y="12" font-size="5" fill="currentColor" stroke="none" font-family="sans-serif">PDF</text></svg>',vid:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1.5" y="3" width="13" height="10" rx="1.5"/><path d="M6.5 6v4l3.5-2z" fill="currentColor" stroke="none"/></svg>',csv:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1.5" y="2" width="13" height="12" rx="1"/><path d="M4 6h8M4 9h8M4 12h5"/></svg>',md:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><path d="M4.5 11V6.5l2 2 2-2V11"/></svg>',file:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 1.5h7l3 3v10h-10z"/><path d="M10 1.5v3h3"/></svg>'};
function iconFor(n,isd){ if(isd)return ICO.dir; n=n.toLowerCase();
 if(n.match(/\.(png|jpe?g|webp|gif)$/))return ICO.img; if(n.endsWith('.pdf'))return ICO.pdf;
 if(n.match(/\.(mp4|avi|mov|webm)$/))return ICO.vid; if(n.match(/\.(csv|xlsx)$/))return ICO.csv;
 if(n.match(/\.(md|txt)$/))return ICO.md; return ICO.file; }
async function api(p){ const r=await fetch(API+p); return r.json(); }
function fmtSize(n){ if(n>=1048576)return(n/1048576).toFixed(1)+'M'; if(n>=1024)return Math.round(n/1024)+'K'; return n+'B'; }
let curDir='', filterType='', sortMode='time';
function ftype(n){ n=n.toLowerCase(); if(n.match(/\.(png|jpe?g|webp|gif)$/))return'img'; if(n.match(/\.(mp4|avi|mov|webm)$/))return'vid';
 if(n.match(/\.(csv|xlsx)$/))return'csv'; if(n.match(/\.(md|txt|log)$/))return'txt'; if(n.endsWith('.pdf'))return'pdf'; return'file'; }
function applyFS(files){ let fs=files.filter(f=>!f.is_dir);
 if(filterType==='img')fs=fs.filter(f=>ftype(f.name)==='img');
 if(filterType==='txt')fs=fs.filter(f=>['txt','csv','md'].includes(ftype(f.name)));
 if(filterType==='vid')fs=fs.filter(f=>ftype(f.name)==='vid');
 if(sortMode==='time')fs.sort((a,b)=>b.mtime-a.mtime);
 if(sortMode==='nameA')fs.sort((a,b)=>a.name.localeCompare(b.name));
 if(sortMode==='nameZ')fs.sort((a,b)=>b.name.localeCompare(a.name));
 if(sortMode==='size')fs.sort((a,b)=>b.size-a.size);
 if(sortMode==='type')fs.sort((a,b)=>ftype(a.name).localeCompare(ftype(b.name))||a.name.localeCompare(b.name));
 return fs; }
const SORT_LABEL={time:'时间',nameA:'A→Z',nameZ:'Z→A',size:'大小',type:'类型'};
async function loadDesk(){

let zoomLv=1, zoomNW=0, zoomNH=0;
function zEl(id){ return document.getElementById(id); }
function updateZoomVal(){ const v=zEl('zoomVal'); if(v) v.textContent=Math.round(zoomLv*100)+'%'; }
function imgZoom(d){ const wrap=zEl('zoomWrap'), img=zEl('zoomImg'); if(!wrap||!zoomNW)return;
 const r=wrap.getBoundingClientRect(); const old=zoomLv;
 zoomLv=Math.min(12,Math.max(0.1,zoomLv+d));
 img.style.width=(zoomNW*zoomLv)+'px'; img.style.height=(zoomNH*zoomLv)+'px';
 wrap.scrollLeft=(wrap.scrollLeft+r.width/2)*zoomLv/old-(r.width/2);
 wrap.scrollTop=(wrap.scrollTop+r.height/2)*zoomLv/old-(r.height/2);
 updateZoomVal(); }
function imgFit(){ const wrap=zEl('zoomWrap'), img=zEl('zoomImg'); if(!wrap||!zoomNW)return;
 const r=wrap.getBoundingClientRect();
 zoomLv=Math.min(1,Math.max(0.02,(r.width-8)/zoomNW,(r.height-8)/zoomNH));
 img.style.width=(zoomNW*zoomLv)+'px'; img.style.height=(zoomNH*zoomLv)+'px';
 wrap.scrollLeft=0; wrap.scrollTop=0; updateZoomVal(); }
function previewFile(path){ switchView('prev'); const b=document.getElementById('prevBody');
 const nm=decodeURIComponent(path.split(/[\\/]/).pop()); document.getElementById('prevName').textContent=nm;
 const url=API+'/api/file?p='+encodeURIComponent(path), t=ftype(nm);
 if(t==='img'){
  zoomLv=1; zoomNW=0; zoomNH=0;
  b.innerHTML='<div style="display:flex;align-items:center;gap:4px;padding:2px 0;flex-shrink:0">'
   +'<button class="iconbtn" onclick="imgZoom(-0.2)" style="width:22px;height:22px">−</button>'
   +'<span id="zoomVal" style="font-size:11px;color:var(--text-m);min-width:44px;text-align:center">100%</span>'
   +'<button class="iconbtn" onclick="imgZoom(0.2)" style="width:22px;height:22px">+</button>'
   +'<button class="iconbtn" onclick="imgFit()" style="width:auto;padding:0 8px;font-size:11px">适应</button>'
   +'<button class="iconbtn" onclick="imgZoom(0.5)" style="width:auto;padding:0 8px;font-size:11px">200%</button>'
   +'<span style="font-size:11px;color:var(--text-m);margin-left:6px">滚轮缩放 · 按住左键拖动平移</span></div>'
   +'<div id="zoomWrap" style="flex:1;overflow:auto;background:var(--bg);position:relative;cursor:grab"><img id="zoomImg" src="'+url+'" draggable="false" style="display:block;margin:0 auto;max-width:none;user-select:none"></div>';
  const wrap=zEl('zoomWrap'), img=zEl('zoomImg');
  img.addEventListener('dragstart',e=>e.preventDefault());
  img.onload=()=>{ zoomNW=img.naturalWidth; zoomNH=img.naturalHeight; imgFit(); };
  wrap.addEventListener('wheel',e=>{ e.preventDefault();
   const rect=wrap.getBoundingClientRect();
   const old=zoomLv;
   zoomLv=Math.min(12,Math.max(0.1,old*(e.deltaY<0?1.2:1/1.2)));
   const mx=(e.clientX-rect.left+wrap.scrollLeft)/old, my=(e.clientY-rect.top+wrap.scrollTop)/old;
   img.style.width=(zoomNW*zoomLv)+'px'; img.style.height=(zoomNH*zoomLv)+'px';
   updateZoomVal();
   wrap.scrollLeft=mx*zoomLv-(e.clientX-rect.left);
   wrap.scrollTop=my*zoomLv-(e.clientY-rect.top);
  },{passive:false});
  let dragging=null;
  wrap.addEventListener('mousedown',e=>{ dragging={x:e.clientX,y:e.clientY,sl:wrap.scrollLeft,st:wrap.scrollTop}; wrap.style.cursor='grabbing'; });
  window.addEventListener('mousemove',e=>{ if(dragging){ wrap.scrollLeft=dragging.sl-(e.clientX-dragging.x); wrap.scrollTop=dragging.st-(e.clientY-dragging.y); } });
  window.addEventListener('mouseup',()=>{ dragging=null; wrap.style.cursor='grab'; });
 } else if(t==='vid')b.innerHTML='<video src="'+url+'" controls autoplay style="max-width:100%;max-height:100%;margin:auto"></video>';
 else if(t==='pdf'){ b.innerHTML='<div id="pdfBox" style="flex:1;overflow:auto;background:var(--bg);padding:4px"><div style="color:var(--text-m);padding:10px;font-size:12px">解析 pdf…</div></div>';
  api('/api/pdf-pages?p='+encodeURIComponent(path)).then(d=>{
   const box=zEl('pdfBox');
   if(!d.ok||!d.pages){ box.innerHTML='<div style="color:var(--text-m);padding:10px;font-size:12px">pdf 解析失败（'+(d.error||'')+'）——<a href="'+url+'" target="_blank" style="color:var(--accent)">用浏览器打开</a></div>'; return; }
   let h=''; for(let i=0;i<d.pages;i++){ h+='<img src="'+API+'/api/pdf-page?p='+encodeURIComponent(path)+'&n='+i+'" style="display:block;max-width:100%;margin:2px auto;background:#fff">'; }
   box.innerHTML=h;
  });
 } else if(t==='csv')api('/api/file?p='+encodeURIComponent(path)).then(d=>renderCsv(d.content||'',b));
 else if(t==='txt'||t==='md')api('/api/file?p='+encodeURIComponent(path)).then(d=>b.innerHTML='<div style="overflow:auto;font-size:'+ED.fs+'px;line-height:'+ED.lh+';padding:'+ED.pad+'px;max-width:'+(ED.w==='不限制'?'none':ED.w+'px')+';font-family:'+edFont()+'">'+mdRender(d.content||'')+'</div>');
 else b.innerHTML='<pre>暂不支持预览：'+nm+'</pre>'; }
function renderCsv(txt,box){ const rows=txt.split(/\r?\n/).filter(x=>x).map(r=>r.split(','));

 rows.slice(1,300).forEach(r=>{ h+='<tr>'; (r||[]).forEach(c=>h+='<td>'+c+'</td>'); h+='</tr>'; });
 box.innerHTML=h+'</tbody></table>'; }

 document.getElementById('logPane').classList.toggle('active',v==='log'); document.getElementById('wsPane').classList.toggle('active',v==='ws'); document.getElementById('prevPane').classList.toggle('active',v==='prev'); }

async function loadPlugins(){ try{ const d=await api('/api/plugins'); const box=document.getElementById('plugins'); box.innerHTML='';

async function renderPlugins(c){ c.innerHTML='<h3>插件</h3><div class="desc">拖入 .zip 安装（含 manifest.json + README.md）· 点击查看详情</div><div class="dropzone" id="dz">拖入插件 zip 到此处安装</div><div id="plugList"></div>';

 const d=await api('/api/plugins'); const pls=d.plugins||[]; const list=document.getElementById('plugList');

  +'<div style="font-size:'+ED.fs+'px;line-height:'+ED.lh+';max-width:'+(ED.w==='不限制'?'none':ED.w+'px')+';padding:'+ED.pad+'px 4px;font-family:'+edFont()+'">'+mdRender(d.content||'')+'</div></div>'; }
 else box.innerHTML='<div style="font-size:12px;color:var(--text-m);margin-top:6px">无说明</div>'; }
function mdRender(txt){ edLoad();
 const esc=(txt||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
 const lines=esc.split('\n'); let html='',inPre=false;
 for(let i=0;i<lines.length;i++){
  const raw=lines[i]; const l=raw.trim();
  if(l.startsWith('```')){ html+=inPre?'</pre>':'<pre style="background:var(--bg);padding:6px 8px;border-radius:4px;font-family:var(--font-mono);font-size:11px;white-space:pre-wrap;margin:4px 0">'; inPre=!inPre; continue; }
  if(inPre){ html+=raw+'\n'; continue; }
  if(l.startsWith('|')){
   const cells=l.split('|').filter(x=>x!==undefined && x.trim()!=='' && x.trim()!=='---').map(x=>x.trim());
   if(l.includes('---')||l.replace(/\|/g,'').trim().split(/[-]+/).length>2) continue;
   html+='<div style="display:flex;border-bottom:.5px solid var(--border)">'+cells.map(c=>'<div style="flex:1;padding:2px 6px;min-width:0;word-break:break-all">'+c+'</div>').join('')+'</div>'; continue;
  }
  let body=raw;
  const fmt=s=>s.replace(/\*\*([^*]+)\*\*/g,'<strong style="font-weight:600">$1</strong>').replace(/`([^`]+)`/g,'<code style="background:var(--bg);padding:0 4px;border-radius:3px;font-family:var(--font-mono);font-size:11px">$1</code>');
  if(l.startsWith('### ')){ html+='<div style="font-weight:600;font-size:'+ED.h3+'px;margin:10px 0 4px">'+fmt(raw.slice(4))+'</div>'; continue; }
  if(l.startsWith('## ')){ html+='<div style="font-weight:600;font-size:'+ED.h2+'px;margin:12px 0 5px;border-left:2px solid var(--accent);padding-left:6px">'+fmt(raw.slice(3))+'</div>'; continue; }
  if(l.startsWith('# ')){ html+='<div style="font-weight:600;font-size:'+ED.h1+'px;margin:14px 0 6px">'+fmt(raw.slice(2))+'</div>'; continue; }
  if(l.startsWith('- ')||l.startsWith('* ')){ html+='<div style="padding-left:14px;margin:1px 0">· '+fmt(raw.slice(2))+'</div>'; continue; }
  if(l==='---'){ html+='<div style="border-top:.5px solid var(--border);margin:6px 0"></div>'; continue; }
  if(l) html+='<div style="margin:2px 0">'+fmt(raw)+'</div>';
 }
 return html; }

/* ===== 素材审核模式（预览 Tab）——流水线 postMessage 驱动 ===== */
var AD={items:[],idx:0,marks:{},force:false};
window.addEventListener('message', function(e){ var d=e.data;
 if(d&&d.type==='wb-audit-start'){ adStart(d.items||[]); } });
function adStart(items){
 AD.items=items; AD.idx=0; AD.marks={};
 var f=document.getElementById('auditMode'); if(f) f.style.display='flex';
 var pb=document.getElementById('prevBody'); if(pb) pb.style.display='none';
 var pn=document.getElementById('prevName'); if(pn) pn.textContent='素材审核';
 switchView('prev');
 var g=0; while(AD.idx<AD.items.length&&AD.items[AD.idx].skip&&!AD.force&&g++<50) AD.idx++;
 adRender();
}
function adCur(){ return AD.items[AD.idx]; }
function adImg(p){ return p?('<img src="'+API+'/api/file?p='+encodeURIComponent(p)+'" style="max-width:100%;max-height:70vh;object-fit:contain">'):'<div style="color:var(--text-m,#999);padding:40px">无参考图</div>'; }
function adRender(){
 var it=adCur(); if(!it) return;
 var need=AD.items.filter(function(x){return !x.skip;}).length;
 document.getElementById('adProg').textContent='审核 '+(AD.idx+1)+'/'+AD.items.length+'（需审 '+need+'）';
 document.getElementById('adLh2').textContent=it.lh;
 document.getElementById('adType2').innerHTML=(it.type||'')+(it.skip?' <span style="color:#b8860b">(双百-已跳过,force纳入)</span>':'');
 document.getElementById('adPic2').innerHTML=adImg(it.ref||it.img||'');
 var m=AD.marks[it.lh];
 ['aOk','aFix','aSrc'].forEach(function(id){var b=document.getElementById(id); if(b) b.style.background='';});
 if(m){ var bid=m==='放行'?'aOk':(m==='送修'?'aFix':'aSrc'); var b=document.getElementById(bid); if(b) b.style.background='#e3f0e3'; }
 document.getElementById('adMarkSt').textContent=m?('已标：'+m+'（可改标反悔）'):'未标记';
 var sk=AD.items.filter(function(x){return x.skip;}).length;
 document.getElementById('adSkipInfo').textContent=sk?(''+sk+' 个双百跳过——点force纳入'):'';
}
function adNav(d){
 if(!AD.items.length) return;
 var n=AD.items.length, ni=AD.idx+d, guard=0;
 while(guard++<60){
  if(ni<0) ni=n-1; if(ni>=n) ni=0;  // 边界循环（wrap）
  if(!(AD.items[ni].skip&&!AD.force)) break;
  ni+=d;
 }
 if(AD.items[ni].skip&&!AD.force){ /* 全 skip——停在原处 */ return; }
 AD.idx=ni; adRender();
}
document.addEventListener('keydown',function(e){
 var am=document.getElementById('auditMode');
 if(!am||am.style.display==='none') return;
 if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){ adNav(-1); }
 else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){ adNav(1); }
 else if(e.key==='Enter'){ adConfirm(); }
});
function adForceTg(){ AD.force=document.getElementById('adForce').checked; adRender(); }
function adMark(res){
 var it=adCur(); if(!it) return;
 AD.marks[it.lh]=res;
 fetch(API+'/api/plg/pipeline/audit?lh='+encodeURIComponent(it.lh)+'&res='+encodeURIComponent(res)).then(function(){ adRender(); });
}
function adConfirm(){
 var need=AD.items.filter(function(x){return !x.skip;});
 var total=need.length, marked=0;
 need.forEach(function(it){ if(AD.marks[it.lh]) marked++; });
 if(marked<total&&!confirm('还有 '+(total-marked)+' 个未标记——确定提交？（未标默认不处理）')) return;
 var stats={放行:0,送修:0,换源:0};
 AD.items.forEach(function(it){ var m=AD.marks[it.lh]; if(m) stats[m]=(stats[m]||0)+1; });
 try{ var ifr=document.querySelector('#wsBody iframe'); if(ifr) ifr.contentWindow.postMessage({type:'wb-audit-done',stats:stats,total:total},'*'); }catch(e){}
 var f=document.getElementById('auditMode'); if(f) f.style.display='none';
 var pb=document.getElementById('prevBody'); if(pb) pb.style.display='';
 var pn=document.getElementById('prevName'); if(pn) pn.textContent='预览';
 switchView('ws');
 alert('审核提交：放行 '+stats['放行']+' · 送修 '+stats['送修']+' · 换源 '+stats['换源']+'（'+(total-marked)+' 未标、'+AD.items.filter(function(x){return x.skip;}).length+' 双百跳过）');
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ERP 数据</title>
<style>
:root{--card:#FBFAF7;--text:#2A2A28;--text-m:#8A8880;--line:#E4E1D8;--accent:#7C6A9E}
*{box-sizing:border-box}
body{margin:0;padding:12px;font:13px/1.5 -apple-system,"Microsoft YaHei",sans-serif;color:var(--text);background:transparent}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.bar input{flex:1;min-width:0;padding:8px 12px;border:.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);font-size:13px;outline:none;height:34px}
.bar input:focus{border-color:var(--accent)}
button{padding:8px 16px;border:.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);cursor:pointer;font-size:12.5px;height:34px}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
#cur{font-size:12px;color:var(--text-m);margin-bottom:8px;min-height:16px}
#conn{font-size:11.5px;color:var(--text-m);margin-bottom:6px}
.card{border:.5px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;background:var(--card)}
.card h4{margin:0 0 8px;font-size:14px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:5px 10px;font-size:12.5px}
.kv .k{color:var(--text-m);text-align:right}
.kv .v{word-break:break-all}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;background:rgba(124,106,158,.12);color:var(--accent);font-size:11px;margin-left:6px}
.desc{margin-top:8px;padding-top:8px;border-top:.5px dashed var(--line);font-size:12px;color:var(--text);max-height:150px;overflow:auto}
.desc img{max-width:100%}
.hl{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div id="conn">连接：加载中…</div>
<div class="bar">
  <input id="kw" placeholder="输入料号（如 33012-2002 / 1-480275-0）回车查询" onkeydown="if(event.key==='Enter')q()">
  <label id="exactLbl" style="display:flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap;cursor:pointer;user-select:none" title="勾选=只精确匹配料号">
    <input type="checkbox" id="exactChk" onchange="EXACT=this.checked;q()">精确
  </label>
  <button class="pri" onclick="q()">查询</button>
</div>
<div id="cur"></div>
<div id="list"></div>
<div class="card" style="margin-top:10px">
  <h4>新品入库报表 <span class="tag">只算入库</span></h4>
  <div style="font-size:11.5px;color:var(--text-m);margin-bottom:8px">
    口径：每产品取<b>历史首次入库</b>的日期（收货单完成时间 date_done），该首入时间落在区间内才列出；只算 incoming，其他不算；按首入倒序。
  </div>
  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px">
    <input id="ibFrom" type="date" style="padding:6px 8px;border:.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);height:32px">
    <span style="color:var(--text-m)">~</span>
    <input id="ibTo" type="date" style="padding:6px 8px;border:.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);height:32px">
    <button onclick="ibQuick('m0')">本月</button><button onclick="ibQuick('m1')">上月</button>
    <button onclick="ibQuick('q0')">本季</button><button onclick="ibQuick('q1')">上季</button>
    <button onclick="ibQuick('y0')">本年</button><button onclick="ibQuick('y1')">去年</button>
  </div>
  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px">
    <input id="ibKw" placeholder="产品型号（可留空=全部）" style="flex:1;min-width:160px;padding:8px 12px;border:.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);font-size:13px;height:34px">
    <select id="ibPl" style="padding:8px 12px;border:.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);font-size:12.5px;height:34px;max-width:260px"><option value="">价格表：不填单价</option></select>
    <button class="pri" onclick="ibRun()">查询</button>
    <button onclick="ibExport()">导出 CSV / XLSX</button>
  </div>
  <div id="ibMsg" style="font-size:12px;color:var(--text-m);margin-bottom:6px"></div>
  <div id="ibOut" style="overflow:auto;max-height:440px"></div>
</div>

<script>
const P='../..';
const API=location.origin+'/api/plg/odoo-erp/';
async function api(a){ const r=await fetch(API+a); return r.json(); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
let EXACT=false;
async function loadConn(){
 const d=await api('conn');
 const el=document.getElementById('conn');
 el.innerHTML=d.ok?('连接：<b>'+esc(d.name)+'</b> · '+esc(d.db)+' @ '+esc(d.url)+' · '+esc(d.user)):('⚠ '+esc(d.error));
}
async function q(){
 const kw=document.getElementById('kw').value.trim(); if(!kw)return;
 document.getElementById('cur').textContent='查询 '+kw+' …';
 const d=await api('query?kw='+encodeURIComponent(kw)+(EXACT?'&exact=1':''));
 const cur=document.getElementById('cur'), list=document.getElementById('list');
 if(!d.ok){ cur.textContent='✗ '+esc(d.error); list.innerHTML=''; return; }
 cur.innerHTML='「'+esc(d.kw)+'」→ '+d.items.length+' 条（'+d.ms+'ms）';
 if(!d.items.length){ list.innerHTML='<div style="color:var(--text-m);font-size:12.5px">ERP 里没找到该料号</div>'; return; }
 list.innerHTML=d.items.map(it=>{
  const price=it.list_price?('<span class="hl">'+it.list_price+'</span>'):'—';
  const qty=it.qty_available||0;
  const cost=it.standard_price?it.standard_price:'—';
  let h='<div class="card"><h4>'+esc(it.name)+(it.product_information_brand?'<span class="tag">'+esc(it.product_information_brand)+'</span>':'')+'</h4>'
   +'<div class="kv">'
   +'<span class="k">售价</span><span class="v">'+price+'</span>'
   +'<span class="k">成本</span><span class="v">'+cost+'</span>'
   +'<span class="k">库存</span><span class="v">'+qty+(qty>0?'':'（无货）')+'</span>'
   +'<span class="k">分类</span><span class="v">'+esc(it.categ_id||'—')+'</span>'
   +'<span class="k">单位</span><span class="v">'+esc(it.uom_id||'—')+'</span>'
   +'<span class="k">上架</span><span class="v">'+(it.sale_ok?'可销售':'否')+(it.active===false?' · 已归档':'')+'</span>'
   +'<span class="k">ERP ID</span><span class="v">'+it.id+'</span>'
   +'</div>';
  const de=it.description_ecommerce||it.product_information_description||'';
  if(de) h+='<div class="desc">'+de+'</div>';
  h+='</div>';
  return h;
 }).join('');
}
loadConn();
</script>

<script>
function ibIso(d){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function ibQuick(k){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth(); let a,b;
  if(k==='m0'){ a=new Date(y,m,1); b=new Date(y,m+1,1); }
  else if(k==='m1'){ a=new Date(y,m-1,1); b=new Date(y,m,1); }
  else if(k==='q0'){ const q=Math.floor(m/3); a=new Date(y,q*3,1); b=new Date(y,q*3+3,1); }
  else if(k==='q1'){ const q=Math.floor(m/3)-1; a=new Date(y,q*3,1); b=new Date(y,q*3+3,1); }
  else if(k==='y0'){ a=new Date(y,0,1); b=new Date(y+1,0,1); }
  else { a=new Date(y-1,0,1); b=new Date(y,0,1); }
  document.getElementById('ibFrom').value=ibIso(a); document.getElementById('ibTo').value=ibIso(b); ibRun();
}
function ibQs(){
  const f=document.getElementById('ibFrom').value, t=document.getElementById('ibTo').value;
  const kw=document.getElementById('ibKw').value.trim(), pl=document.getElementById('ibPl').value;
  if(!f||!t) return null;
  return 'from='+f+'&to='+t+'&kw='+encodeURIComponent(kw)+(pl?('&plid='+pl):'');
}
async function ibPls(){
  const d=await api('pricelists'); const s=document.getElementById('ibPl'); if(!d.ok||!s) return;
  (d.items||[]).forEach(p=>{ const o=document.createElement('option'); o.value=p.id; o.textContent='价格表：'+p.name; s.appendChild(o); });
}
async function ibRun(){
  const qs=ibQs(); const msg=document.getElementById('ibMsg'), out=document.getElementById('ibOut');
  if(!qs){ msg.textContent='先选开始和结束日期'; return; }
  msg.textContent='查询中…'; out.innerHTML='';
  const d=await api('inbound?'+qs);
  if(!d.ok){ msg.textContent='✗ '+esc(d.error); return; }
  msg.innerHTML='<b>'+d.n+'</b> 个品 ｜ '+esc(d.from.slice(0,10))+' → '+esc(d.to.slice(0,10))+' ｜ '+esc(d.scope||'')+' ｜ '+d.ms+'ms'+(d.note?('<br>'+esc(d.note)):'');
  if(!d.rows.length) return;
  const th=h=>'<th style="text-align:left;padding:4px 6px;border-bottom:.5px solid var(--line);color:var(--text-m);font-weight:500;white-space:nowrap">'+h+'</th>';
  const td=(v,st)=>'<td style="padding:3px 6px;border-bottom:.5px solid #eee;'+(st||'')+'">'+v+'</td>';
  out.innerHTML='<table style="width:100%;border-collapse:collapse;font-size:12px"><tr>'
    +['首次入库','型号','名称','编码','类别','数量','单价','收货单'].map(th).join('')+'</tr>'
    + d.rows.map(r=>'<tr>'
      + td(esc((r.date||'').slice(0,10)))
      + td('<b>'+esc(r.name)+'</b>')
      + td(esc(r.disp||r.name))
      + td(esc(r.code||'—'),'color:var(--text-m)')
      + td(esc(r.categ||''))
      + td(esc(r.qty),'text-align:right')
      + td((r.price===null||r.price===undefined)
            ? '<span style="color:var(--text-m)" title="'+esc(r.price_note||'')+'">—</span>'
            : '<span class="hl">'+r.price+'</span>'+(r.price_note?('<span title="'+esc(r.price_note)+'" style="color:var(--text-m)"> *</span>'):''), 'text-align:right;cursor:help')
      + td(esc(r.picking),'color:var(--text-m)')
      +'</tr>').join('')+'</table>';
}
async function ibExport(){
  const qs=ibQs(); const msg=document.getElementById('ibMsg');
  if(!qs){ msg.textContent='先选开始和结束日期'; return; }
  msg.textContent='导出中…';
  const d=await api('inbound-export?'+qs);
  if(!d.ok){ msg.textContent='✗ '+esc(d.error); return; }
  msg.innerHTML='已导出 <b>'+d.n+'</b> 行（CSV + XLSX）→ <code>'+esc(d.dir)+'</code>';
}
ibPls();
</script>
</body>
</html>

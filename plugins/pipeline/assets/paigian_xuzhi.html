<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 2848px; }
  body {
    font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
    background: #fff;
    color: #333;
    padding: 130px 130px 130px 130px;
  }
  .title {
    text-align: center;
    font-size: 68px;
    font-weight: 700;
    color: #222;
    letter-spacing: 12px;
    margin-bottom: 60px;
  }
  .divider {
    border: none;
    border-top: 3px solid #d9d9d9;
    margin: 50px 0;
  }
  .item {
    margin-bottom: 55px;
  }
  .item-num {
    font-size: 44px;
    font-weight: 700;
    color: #111;
    margin-bottom: 14px;
  }
  .item-text {
    font-size: 40px;
    color: #444;
    line-height: 1.75;
    text-align: justify;
  }
  .section-title {
    font-size: 46px;
    font-weight: 700;
    color: #c00;
    margin: 10px 0 18px;
  }
  .notice {
    font-size: 40px;
    color: #444;
    line-height: 1.75;
    text-align: justify;
  }
</style>
</head>
<body>
  <div class="title">拍前须知</div>
  <hr class="divider">

  <div class="item">
    <div class="item-num">1. 询价要求</div>
    <div class="item-text">询价请提供公司名称、型号（图片无效）、数量。</div>
  </div>

  <div class="item">
    <div class="item-num">2. 正品保证</div>
    <div class="item-text">本店保证所售产品均来自原厂正品，假一罚十！</div>
  </div>

  <div class="item">
    <div class="item-num">3. 价格与下单</div>
    <div class="item-text">网上为批量上传价格不作为最终成交价，拍前请带量询价，按数量阶梯报价。直拍无效，为防止乱拍请确认后提交订单后通知客服改运费。</div>
  </div>

  <hr class="divider">

  <div class="section-title">广告词汇及价格声明</div>
  <div class="notice">凡是出现在本店产品标题、图片、详情、价格、最高级广告词、极限词、界定词等仅限本店范围内对比，直接拍订单无效，涉及资质、认证、政策以咨询在线客服为准，在线客服未回复视为不售产品。</div>
</body>
</html>

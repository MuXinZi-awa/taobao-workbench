<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<!-- 模板：TVS 瞬态电压抑制器详情图（分类专用：参数分「最大额定值」与「电气特性」两组） -->
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1200px;background:#fff;font-family:"Microsoft YaHei","Segoe UI",sans-serif;color:#12181f;}
  .sec{padding:56px 64px;}
  .hero{background:linear-gradient(180deg,#eef4f8 0%,#ffffff 100%);border-bottom:1px solid #dde7ee;}
  .hero-in{display:flex;gap:44px;align-items:center;}
  .pic{flex:0 0 420px;height:420px;background:#fff;border:1px solid #dde7ee;border-radius:14px;
       display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .pic img{width:100%;height:100%;object-fit:contain;}
  .meta{flex:1 1 auto;min-width:0;}
  .brand{font-size:15px;letter-spacing:3px;color:#0f6b6b;font-weight:700;margin-bottom:14px;}
  .model{font-size:42px;font-weight:800;letter-spacing:.5px;line-height:1.15;word-break:break-all;}
  .headline{font-size:30px;font-weight:800;color:#0f6b6b;margin-top:12px;}
  .headline small{font-size:16px;font-weight:600;color:#6b7280;margin-left:8px;}
  .tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;}
  .tag{font-size:15px;padding:7px 15px;border-radius:20px;background:#e6f4f4;color:#0f6b6b;
       border:1px solid #c6e5e5;font-weight:600;}
  .tag.n{background:#f1f5f9;color:#475569;border-color:#e2e8f0;}
  .h2{font-size:28px;font-weight:800;margin-bottom:8px;}
  .h2::after{content:"";display:block;width:52px;height:4px;background:#0f6b6b;margin-top:12px;border-radius:2px;}
  .h3{font-size:17px;font-weight:800;color:#0f6b6b;margin:32px 0 -14px;letter-spacing:.5px;}
  table{width:100%;border-collapse:collapse;margin-top:34px;font-size:19px;}
  thead th{background:#14232e;color:#fff;font-weight:700;font-size:18px;padding:15px 20px;text-align:left;}
  tbody td{padding:15px 20px;border-bottom:1px solid #e8eef3;}
  tbody tr:nth-child(even){background:#f8fbfc;}
  td.k{width:58%;color:#465560;}
  td.v{width:42%;font-weight:800;font-size:21px;font-variant-numeric:tabular-nums;}
  .feats{margin-top:34px;display:grid;gap:14px;}
  .f{display:flex;gap:18px;align-items:flex-start;padding:18px 20px;background:#f8fbfc;
     border:1px solid #e8eef3;border-radius:10px;}
  .ft{flex:0 0 110px;font-size:17px;font-weight:800;color:#0f6b6b;}
  .fd{flex:1 1 auto;font-size:17px;line-height:1.7;color:#33404a;}
  .foot{background:#14232e;color:#94a3ae;padding:30px 64px;font-size:15px;line-height:1.9;}
  .foot b{color:#e2e8ee;}
</style></head><body>

<div class="hero"><div class="sec"><div class="hero-in">
  <div class="pic">__IMG__</div>
  <div class="meta">
    <div class="brand">__BRAND__</div>
    <div class="model">__MODEL__</div>
    <div class="headline">__HEADLINE__<small>__HEADNOTE__</small></div>
    <div class="tags">__TAGS__</div>
  </div>
</div></div></div>

<div class="sec">
  <div class="h2">技术参数</div>

  <div class="h3">最大额定值</div>
  <table>
    <thead><tr><th>参数项</th><th>数值</th></tr></thead>
    <tbody>
__ROWS_A__
    </tbody>
  </table>

  <div class="h3" style="margin-top:44px">电气特性</div>
  <table>
    <thead><tr><th>参数项</th><th>数值</th></tr></thead>
    <tbody>
__ROWS_E__
    </tbody>
  </table>
</div>

<div class="sec" style="padding-top:0">
  <div class="h2">产品特性</div>
  <div class="feats">
__FEATS__
  </div>
</div>

<div class="foot">
  <b>__MODEL__</b> ｜ 数据来源：__BRAND_FULL__ 原厂规格书 <b>__SERIES__</b>（未做任何改动）<br>
  以上为 TA = 25 °C 条件下的规格值，实际性能随应用条件变化，请以原厂最新规格书为准。
</div>

</body></html>

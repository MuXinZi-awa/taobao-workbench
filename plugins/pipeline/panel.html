<!doctype html><meta charset="utf-8">
<style>
input, textarea, select { background:var(--card,#fffdf7); color:var(--text,#333); }
input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus {
 -webkit-box-shadow:0 0 0 30px var(--card,#fffdf7) inset !important;
 -webkit-text-fill-color:var(--text,#333) !important; }
input::placeholder { color:var(--text-m,#999); }

 body{font-family:inherit;margin:0;background:transparent;color:var(--text,#333)}
 .bar{display:flex;gap:8px;margin-bottom:10px}
 input[type=text]{flex:1;border:.5px solid var(--border,#ccc);border-radius:6px;padding:7px 10px;font-size:13px;background:#fffdf7}
 button{border:0;border-radius:6px;padding:7px 14px;font-size:13px;cursor:pointer;background:var(--accent,#4a7cf7);color:#fff}
 button.ghost{background:transparent;border:.5px solid var(--border,#ccc);color:var(--text,#333)}
 .drop{border:2px dashed var(--border,#aaa);border-radius:10px;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--text-l,#888);font-size:14px;margin-bottom:10px;cursor:pointer;background:#fffdf7;gap:6px;font-weight:600}
 .drop.over{border-color:var(--accent,#4a7cf7);background:rgba(74,124,247,.06)}
 .cur{font-size:12px;color:var(--text-l,#888);margin-bottom:4px;min-height:16px}
 .stage{display:flex;align-items:center;gap:6px;padding:7px 10px;border:.5px solid var(--border,#ddd);border-radius:8px;background:var(--bg-card,#fbf9f4);margin-bottom:6px;flex-wrap:wrap}
 .sdot{width:9px;height:9px;border-radius:50%;background:#ddd;flex:none;margin:0 2px}
 .sdot.on{background:#f6b93b;box-shadow:0 0 5px rgba(246,185,59,.7)}
 .sdot.done{background:#2a7a3a}
 .sdot.fail{background:#d33}
 .stagel{font-size:12px;color:var(--text,#333);margin:0 2px}
 .stagenm{font-size:12px;font-weight:600;color:var(--accent,#4a7cf7);margin-right:10px;min-width:80px}
 .sitem{display:inline-flex;align-items:center;gap:2px;cursor:pointer;padding:2px 6px;border-radius:6px;border:.5px solid transparent}
 .sitem:hover{background:rgba(74,124,247,.08);border-color:var(--border,#ddd)}
 .sitem.pending{opacity:.45}
 .sitem.pending:hover{opacity:.85}
 .sitem.now{border-color:var(--accent,#4a7cf7);background:rgba(74,124,247,.10)}
 .sarrow{color:var(--border,#ccc);font-size:11px;margin:0 1px}
 table{border-collapse:collapse;width:100%;font-size:12px}
 th,td{border-bottom:.5px solid var(--border,#eee);padding:5px 6px;text-align:left;white-space:nowrap}
 th{position:sticky;top:0;background:var(--bg-card,#fbf9f4);font-weight:600;color:var(--text-l,#666)}
 tr.doing td{background:rgba(74,124,247,.08);outline:1.5px solid var(--accent,#4a7cf7)}
 td.missing{color:#d33}
 td.ok{color:#2a7a3a}
 .pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;border:.5px solid}
 .pill.y{border-color:#d33;color:#d33}
 .pill.n{border-color:#2a7a3a;color:#2a7a3a}
 .batchprog{display:none;align-items:center;gap:8px;padding:5px 10px;border:.5px solid var(--accent,#4a7cf7);border-radius:6px;margin-bottom:6px;font-size:12px;color:var(--accent,#4a7cf7);background:rgba(74,124,247,.06)}

 .audit{border:.5px solid var(--border,#ccc);border-radius:10px;padding:10px;margin-top:8px;background:var(--card,#fffdf7);display:none}
 .audit .head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
 .audit .picbox{display:flex;gap:10px;min-height:220px}
 .audit .mainpic{flex:1;display:flex;align-items:center;justify-content:center;background:var(--bg,#f5f5f2);border:.5px solid var(--border,#ddd);border-radius:8px;min-height:220px;overflow:hidden}
 .audit .mainpic img{max-width:100%;max-height:320px;object-fit:contain}
 .audit .files{width:130px;border:.5px solid var(--border,#ddd);border-radius:8px;overflow:auto;max-height:260px;padding:4px}
 .audit .fitem{padding:3px 6px;font-size:11px;cursor:pointer;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .audit .fitem.on{background:var(--accent,#4a7cf7);color:#fff}
 .audit .fitem img{width:100%;height:36px;object-fit:cover;border-radius:3px;display:block;margin-bottom:2px}
 .audit .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
 .audit button{padding:5px 12px;border-radius:6px;border:.5px solid;cursor:pointer;font-size:12px;background:transparent;color:var(--text,#333)}
 .audit .ok{border-color:#2a7a3a;color:#2a7a3a}.audit .ok.on{background:#2a7a3a;color:#fff}
 .audit .fix{border-color:#b8860b;color:#b8860b}.audit .fix.on{background:#b8860b;color:#fff}
 .audit .src{border-color:#4a7cf7;color:#4a7cf7}.audit .src.on{background:#4a7cf7;color:#fff}
 .audit .st{font-size:12px;margin-left:auto;color:var(--text-l,#888)}

 /* ── 分区与节奏：每块一个卡，8px 竖节奏，标题行打头 ── */
 .phead{display:flex;align-items:center;gap:10px;padding:0 2px 8px}
 .ptitle{font-size:12.5px;font-weight:600;color:var(--text,#333)}
 .pdim{font-size:11.5px;color:var(--text-m,#888)}
 div:has(> #acctbar){margin-bottom:0 !important}
 .bar{background:var(--card,#fffdf7);border:.5px solid var(--border,#ddd);border-radius:var(--r,8px);
      padding:10px 12px;margin-bottom:8px;gap:8px 10px;align-items:center;flex-wrap:wrap}
 .bar::before{content:attr(data-zone);font-size:11.5px;font-weight:600;color:var(--text-m,#888);
      margin-right:2px;padding-right:10px;border-right:.5px solid var(--border,#eee)}
 .bar input[type=text]{min-width:200px}
 .bar label{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:12px;color:var(--text-l,#888)}
 .bar select{font-size:12px;border:.5px solid var(--border,#ccc);border-radius:6px;padding:6px 8px;background:#fffdf7;color:var(--text,#333)}
 .stage{background:var(--card,#fffdf7);border-color:var(--border,#ddd);padding:10px 12px;margin-bottom:8px}
 .cur{margin-bottom:6px}
 #batchprog{margin-bottom:8px}
 #repairBar{margin-bottom:8px}
 div:has(> #tb){background:var(--card,#fffdf7);border:.5px solid var(--border,#ddd);
      border-radius:var(--r,8px);padding:0;overflow:auto;max-height:52vh;margin-bottom:8px}
 #tb th:first-child,#tb td:first-child{padding-left:12px}
 #tb th:last-child,#tb td:last-child{padding-right:12px}
 #tb tbody tr:hover td{background:rgba(74,124,247,.05)}
 .drop{min-height:96px;margin-bottom:8px;border-radius:var(--r,8px)}
 #catSt{margin:0 0 4px 2px !important}
 #fieldbar{margin:0 0 8px 2px !important}
</style>

<div class="phead"><span class="ptitle">流水线 · 上品 / 优化 / 推广</span><span id="acctbar" class="pdim">账号 —</span></div><script>
(async function(){
  try{
    var r = await fetch('/api/plg/pipeline/acct').then(function(x){return x.json();});
    var el = document.getElementById('acctbar');
    if(el && r && r.account) el.textContent = '账号 ' + (r.account.name || '未命名') + (r.account.member_id ? (' \u00b7 ' + r.account.member_id) : '');
  }catch(e){}
})();
</script>
<div class="bar" id="mainbar" data-zone="查询与操作">
  <input id="lh" type="text" placeholder="料号 或 淘宝 ID（单量回车）">
  <button onclick="go()">查询</button><button id="clsBtn" onclick="classify()">▶ 查询分流</button><button onclick="adStartFrom(0)">📋 开始审核</button><button id="rpBtn" onclick="repairRun()" style="display:none">🛠 送修处理</button><button id="ssBtn" onclick="srcRun()" style="display:none">🔁 换源处理</button>
  <button class="ghost" onclick="demo()">试填</button>
  <label style="font-size:12px;color:var(--text-l,#999);margin-left:6px" title="上品/优化：只走流程不提交，用来试跑"><input type="checkbox" id="dryChk"> 预演不提交</label>
  <label style="font-size:12px;color:var(--text-l,#999);margin-left:6px" title="素材：不跳过已生成的图，强制重做（用于清掉旧脏图）"><input type="checkbox" id="forceChk"> 强制重做</label>
</div>
<div class="bar" id="catbar" data-zone="类目与实现">
  <span style="font-size:12px;color:var(--text-l,#888);white-space:nowrap">类目</span>
  <input id="catKw" type="text" placeholder="打类目名，如 连接器 / 保险丝 / 文胸内衣" style="max-width:240px">
  <button class="ghost" onclick="catSearch()">🔍 搜类目</button>
  <select id="catSel" style="flex:1;min-width:220px;font-size:12px;border:.5px solid var(--border,#ccc);border-radius:6px;padding:6px;background:#fffdf7"><option value="">（先搜类目）</option></select>
  <button class="ghost" onclick="catSave()">记住类目</button>
  <span style="flex:1"></span>
  <span style="font-size:12px;color:var(--text-l,#888);white-space:nowrap">上品/优化实现</span>
  <select id="pubImpl" onchange="pubImplSave()" style="font-size:12px;border:.5px solid var(--border,#ccc);border-radius:6px;padding:6px;background:#fffdf7">
    <option value="script">脚本（UI全流程·可提交）</option>
    <option value="api">接口（只出计划+照镜子·不提交）</option>
  </select>
  <label style="font-size:12px;color:var(--text-l,#999)" title="仅接口版：把改后的表单发给 previewDraftSubmit.htm 照一次镜子（非提交，不改商品）"><input type="checkbox" id="mirrorChk"> 照镜子</label>
</div>
<div id="catSt" style="font-size:11.5px;color:var(--text-m,#888);margin:-4px 0 6px 2px">类目 —</div>
<div id="fieldbar" style="font-size:11.5px;color:var(--text-m,#888);margin:-2px 0 8px 2px"></div>
<div class="drop" id="drop"><div>📥 拖入 csv / xlsx（批量）</div><div style="font-size:11px;color:var(--text-l,#999);font-weight:400">自动识别料号列，逐行扫描——点击或拖拽</div></div>
<div class="stage" id="stage"><span class="stagenm" id="stnm">待命</span><span id="stageBar" style="display:flex;align-items:center;gap:6px;flex:1;justify-content:center;flex-wrap:wrap">
 <span style="font-size:12px;color:var(--text-l,#999)">阶段加载中…</span></span></div>
<div class="cur" id="cur"></div>
<div class="batchprog" id="batchprog"></div>
<div id="repairBar" style="display:none;padding:5px 10px;border:.5px solid #b8860b;border-radius:6px;margin-bottom:6px;font-size:12px;color:#b8860b;background:rgba(184,134,11,.06)"></div>
<div style="overflow:auto;max-height:52vh"><table id="tb">
<thead><tr><th>料号</th><th>类型</th><th>ID</th><th>素材</th><th>人工审核</th><th>上品/优化</th><th>推广</th></tr></thead>
<tbody></tbody></table></div>

<script src="../../vendor/xlsx.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const P="/api/plg/pipeline/";
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const cell=(v,cls='')=>'<td class="'+cls+'">'+esc(v)+'</td>';

var curItems=[];
function curHasAudit(items){
 try{
  var f=0,h=0; items.forEach(function(x){ var a=(x.audit||''); if(a.match(/送修/))f++; if(a.match(/换源/))h++; });
  var rb=document.getElementById('rpBtn'), sb=document.getElementById('ssBtn');
  if(rb) rb.style.display=f?'':'none';
  if(sb) sb.style.display=h?'':'none';
 }catch(e){}
}
function render(items){ curHasAudit(items);
 curItems=items; const tb=$('#tb tbody');
 tb.innerHTML=items.map((it,i)=>
  '<tr id="r'+i+'" style="cursor:pointer" onclick="adStartFrom('+i+')">'+cell(it.lh)+typeCell(it.type)+cell(it.id||'—')
  +(it.素材==='齐'?cell('齐','ok'):cell(it.素材,'missing'))
  +cell(it.审核||'待审')+cell(it['上品/优化']||'—')+cell(it.推广||'—')+'</tr>').join('');
 if(!items.length) tb.innerHTML='<tr><td colspan=7 style="color:#aaa;text-align:center;padding:16px">空——拖入清单或输料号</td></tr>';
}
function highlight(i){ document.querySelectorAll('#tb tr').forEach(r=>r.classList.remove('doing'));
 const r=document.getElementById('r'+i); if(r)r.classList.add('doing'); }

/* ── 阶段条（0915 框架 · 数据驱动：定义从后端 /stages 拉，明天填血肉只动后端）── */
var STAGES=[];                      // [{key,label,ready,desc}]
function idxOf(k){ for(var i=0;i<STAGES.length;i++){ if(STAGES[i].key===k) return i; } return -1; }
async function loadStages(){
 try{
  var d=await fetch(P+'stages').then(function(r){return r.json();});
  if(d&&d.ok&&d.stages&&d.stages.length){ STAGES=d.stages; renderStages(); }
 }catch(e){}
}
function renderStages(){
 var bar=document.getElementById('stageBar'); if(!bar) return;
 bar.innerHTML=STAGES.map(function(s,i){
  return '<span class="sitem'+(s.ready?'':' pending')+'" id="si'+i+'" title="'+esc((s.ready?'':'【未接线】')+(s.desc||''))+'" onclick="runStage('+i+')">'
   +'<span class="sdot" id="s'+i+'"></span><span class="stagel">'+esc(s.label)+'</span></span>';
 }).join('<span class="sarrow">\u2192</span>');
}
function setStage(idx,st,nm){ if(idx>=0&&idx<STAGES.length){ const d=document.getElementById('s'+idx); if(d) d.className='sdot '+st;
  const it=document.getElementById('si'+idx); if(it) it.className='sitem'+(STAGES[idx].ready?'':' pending')+(st==='on'?' now':''); }
 $('#stnm').textContent=nm||(((STAGES[idx]||{}).label||'')+'中'); }
function setStageKey(k,st,nm){ setStage(idxOf(k),st,nm); }
/* 阶段入口：点阶段条上的格子 = 跑该阶段（未接线的只提示，不动任何真进程） */
async function runStage(i){
 var s=STAGES[i]; if(!s) return;
 if(!s.ready){ $('#cur').textContent='\u23f3「'+s.label+'」还没接血肉 —— 计划调用：'+s.desc; return; }
 var v=(curLhs&&curLhs.length)?curLhs.join(','):$('#lh').value.trim();
 if(!v){ alert('先输料号或拖入清单'); return; }
 setStage(i,'on',s.label);
 var _dry=document.getElementById('dryChk'), _fo=document.getElementById('forceChk');
 var _mi=document.getElementById('mirrorChk');
 var d=await fetch(P+'run?stage='+encodeURIComponent(s.key)+'&lhs='+encodeURIComponent(v)+((_dry&&_dry.checked)?'&dry=1':'')+((_fo&&_fo.checked)?'&force=1':'')+((_mi&&_mi.checked)?'&mirror=1':'')).then(function(r){return r.json();});
 if(!d.ok){ setStage(i,'fail',s.label+' \u2717'); $('#cur').textContent='\u2717 '+(d.error||'执行失败'); return; }
 if(d.items) render(d.items);
 setStage(i,'done',s.label+' ok');
 $('#cur').textContent='「'+s.label+'」完成'+(d.msg?('：'+d.msg):'');
}
loadStages();
/* ── 类目（面板打人话 → 脚本自己搜 catId；命中缓存秒回）+ 上品/优化实现开关 ── */
function _catSt(t){ var e=document.getElementById('catSt'); if(e) e.textContent=t; }
async function loadSettings(){
 try{
  var d=await fetch(P+'settings').then(function(r){return r.json();});
  if(!d||!d.ok) return;
  var s=d.settings||{}, c=s.category||{};
  if(c.kw){ var e=document.getElementById('catKw'); if(e) e.value=c.kw; }
  var pi=document.getElementById('pubImpl'); if(pi&&s.pub_impl) pi.value=s.pub_impl;
  _catSt(c.catId ? ('类目 已记：'+c.kw+' → '+c.catId+'  '+(c.path||[]).join(' > ')) : '类目 未指定（上品要先定类目）');
  var fb=document.getElementById('fieldbar');
  if(fb&&d.fields) fb.textContent='上品/优化字段集（一处维护 item_fields.py）：'+d.fields.map(function(f){return f.label;}).join(' · ');
 }catch(e){}
}
async function catSearch(){
 var kw=(document.getElementById('catKw').value||'').trim();
 if(!kw){ alert('先打一个类目词，比如 连接器'); return; }
 _catSt('搜「'+kw+'」中…（首次要起浏览器，约 10-20 秒；之后走缓存）');
 var d=await fetch(P+'catsearch?kw='+encodeURIComponent(kw)).then(function(r){return r.json();});
 if(!d.ok){ _catSt('✗ '+(d.error||'搜索失败')); return; }
 var cs=(d.result&&d.result.candidates)||[];
 var sel=document.getElementById('catSel');
 sel.innerHTML = cs.length ? cs.map(function(c,i){
   return '<option value="'+i+'">'+esc(c.id)+'  '+(c.path||[]).join(' > ')+'</option>';
 }).join('') : '<option value="">（没搜到候选类目）</option>';
 _catSt('候选 '+cs.length+' 个'+(d.cached?'（缓存命中·秒回）':'')+'——选中后点「记住类目」');
}
async function catSave(){
 var kw=(document.getElementById('catKw').value||'').trim();
 var sel=document.getElementById('catSel');
 if(!sel||!sel.value){ alert('先搜一下类目再选'); return; }
 var txt=(sel.options[sel.selectedIndex].textContent||'').trim();
 var id=txt.split(/\s+/)[0];
 var path=txt.replace(/^\S+\s*/,'');
 var d=await fetch(P+'catset',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({kw:kw,catId:id,path:path?path.split(' > '):[]})}).then(function(r){return r.json();});
 if(d.ok){ var c=(d.settings||{}).category||{}; _catSt('类目 已记：'+c.kw+' → '+c.catId+'  '+(c.path||[]).join(' > ')); }
 else _catSt('✗ '+(d.error||'保存失败'));
}
async function pubImplSave(){
 var v=(document.getElementById('pubImpl')||{}).value||'script';
 await fetch(P+'setsetting?pub_impl='+encodeURIComponent(v)).then(function(r){return r.json();});
 _catSt('实现已切：'+(v==='api'?'接口版（只出计划+照镜子，不提交）':'脚本版（UI 全流程）'));
}
loadSettings();
var curLhs=[];
async function scan(lhs){
 curLhs=lhs; const items=[]; $('#cur').textContent='批量 '+lhs.length+' 品…';
 for(let i=0;i<lhs.length;i++){ $('#cur').textContent='处理中：'+lhs[i]+'（'+(i+1)+'/'+lhs.length+'）'; $('#stnm').textContent=lhs[i]; highlight(i); await new Promise(r=>setTimeout(r,50));
  const d=await fetch(P+'scan?lhs='+encodeURIComponent(lhs[i])).then(r=>r.json());
  if(d.ok&&d.items&&d.items[0]) items.push(d.items[0]); }
 var missN=items.filter(function(x){return x.素材!=='齐'&&x.素材!=='—';}).length;
 if(missN===0){ setStageKey('material','done','素材齐'); }
 else { setStageKey('material','on','素材缺'+missN+'品'); }
 $('#cur').textContent='素材扫描完成 '+items.length+' 品（缺素材 '+missN+'——黄灯提示待补）';
 render(items);
}
function typeCell(t){
 var col = t==='老品-双百跳过'?'#2a7a3a':(t==='新品-待上架'?'#b8860b':(t&&t.indexOf('需优化')>=0?'#4a7cf7':'#999'));
 return '<td style="color:'+col+';white-space:nowrap">'+(t||'—')+'</td>'; }
async function classify(){
 var v=curLhs.length?curLhs.join(','):$('#lh').value.trim();
 if(!v){ alert('先输料号或拖入 csv'); return; }
 $('#cur').textContent='查询分流中（每品搜+查双百，约 5-10s/品）…';
 var d=await fetch(P+'classify?lhs='+encodeURIComponent(v)).then(r=>r.json());
 if(!d.ok){ $('#cur').textContent='✗ '+(d.error||''); return; }
 render(d.items||[]);
 setStageKey('query','done','查询分流完成'); $('#cur').textContent='分流完成 '+d.items.length+' 品——点「开始审核」或行';
}
function openAuditIdx(i){ adStartFrom(i); }
async function adStartFrom(i){
 var list=curItems||[]; if(!list.length){ alert('先查询/分流'); return; }
 if(!list[0].type){ // 未分流——自动先分类（补 type/skip 依据）
  $('#cur').textContent='先补查询分流…'; curLhs=list.map(function(x){return x.lh;});
  var v=curLhs.join(',');
  var cd=await fetch(P+'classify?lhs='+encodeURIComponent(v)).then(function(r){return r.json();});
  if(cd.ok) list=cd.items; curItems=list;
 }
 if(i>0) list=list.slice(i);
 $('#cur').textContent='收集审核素材（参考图）…';
 var items=[], skipN=0;
 for(var k=0;k<list.length;k++){
  var it=list[k];
  var skip = (it.type||'').indexOf('双百跳过')>=0 && !(it.audit||'').match(/送修|待复检|换源/);
  // 在途品（送修/待复检/换源）不算 skip——仍要复检（上面正则保的就是它）
  if(skip){ skipN++; continue; }
   var rf=it.ref||'', og=it.orig||'';
   try{ // 在途品（待复检/换源/送修）现场重查 ref——避免送修完成后旧快照显示老图
    var dr=await fetch(P+'audit-ref?lh='+encodeURIComponent(it.lh)).then(r=>r.json());
    if(dr.ok&&dr.audit){ rf=dr.ref||rf; og=dr.orig||og; }
   }catch(e){}
   if(!rf){ try{ var d=await fetch(P+'material?lh='+encodeURIComponent(it.lh)).then(r=>r.json());
    rf=(d.material&&d.material['参考图'])||''; }catch(e){} }
   items.push({lh:it.lh,type:it.type||'',ref:rf,orig:og,skip:false,audit:it.audit||''});
 }
 parent.postMessage({type:'wb-audit-start',items:items},'*');
 setStageKey('audit','on','人工审核中');
 if(!items.length){ $('#cur').textContent='本批无需审核（双百跳过 '+skipN+' 个已排除）——可直接进「上品/优化」'; return; }
 $('#cur').textContent='审核开始 需审 '+items.length+' 品（双百跳过 '+skipN+' 个已排除）——预览 Tab 标记，确认返回';
}
window.addEventListener('message', function(e){ var d=e.data;
 if(d&&d.type==='wb-audit-done'){
  var v=curLhs.length?curLhs.join(','):$('#lh').value.trim();
  $('#cur').textContent='审核已提交（放行'+((d.stats&&d.stats['放行'])||0)+' 送修'+((d.stats&&d.stats['送修'])||0)+' 换源'+((d.stats&&d.stats['换源'])||0)+'）——刷新状态';
  var passN=((d.stats&&d.stats['放行'])||0), fixN=(d.stats&&d.stats['送修'])||0, srcN=(d.stats&&d.stats['换源'])||0;
  // 人工审核完成 = 无在途处理（送修/换源都处理完）——全放行/无在途即绿
  if(!fixN && !srcN){ setStageKey('audit','done','审核完成'); }
  else { setStageKey('audit','on','审核中-送修'+fixN+'/换源'+srcN+'待处理'); }
  var rb=document.getElementById('rpBtn');
  if(rb) rb.style.display=(fixN>0)?'':'none';
  if(fixN>0) $('#cur').textContent='有 '+fixN+' 品标送修——点「🛠 送修处理」触发 AI 修图（回来走复检）';
  $('#cur').textContent='审核提交：放行'+passN+' 送修'+fixN+' 换源'+srcN+'（需审'+d.total+'）';
  if(v) scan(v.split(',')); }
});
async function repairRun(){
 var d=await fetch(P+'repair').then(function(r){return r.json();});
 $('#cur').textContent=d.msg||('✗ '+(d.error||''));
}

async function srcRun(){
 var v=(curLhs&&curLhs.length)?curLhs.join(','):$('#lh').value.trim();
 if(!v){ alert('先查询要换源的品'); return; }
 var d=await fetch(P+'src-src').then(function(r){return r.json();});
 $('#cur').textContent=d.ok?d.msg:('✗ '+(d.error||'启动失败'));
}

var PANEL_T0 = Math.floor(Date.now()/1000);   // 本轮面板打开的时刻——比它早的状态一律不认（旧档不走）
function repairPoll(){
 fetch(P+'repair-status').then(function(r){return r.json();}).then(function(d){
  var bar=document.getElementById('repairBar'); if(!bar) return;
  var st=d.state;
  // 旧记录赖着不走：repair_state.json 跑完不自清，只看内容会天天冒旧横幅。
  // 所以只认两种情况：① 真在跑（且不过期）② 本轮面板打开之后才结束的。
  var age=(typeof d.age_sec==='number')?d.age_sec:1e9;
  var stale=!!d.stale||age>7200;
  var running=!!(st&&st.total>0&&(st.done+st.fail<st.total||st.cur));
  var endedNow=!!(st&&st.total>0&&st.done+st.fail>=st.total&&st.msg
                  &&typeof d.mtime==='number'&&d.mtime>=PANEL_T0-120);
  if(!st||stale||(!running&&!endedNow)){ bar.style.display='none'; return; }
  bar.style.display='block';
  bar.textContent=running
    ? ('🛠 送修中 '+st.done+'/'+st.total+'（当前 '+(st.cur||'—')+'，失败 '+st.fail+'）——完成后自动标待复检')
    : ('✅ 送修批结束：'+st.msg+'——待复检品进审核复检');
 });
}
setInterval(repairPoll,5000);
async function go(){
 const v=$('#lh').value.trim(); if(!v)return;
 // 单品也走分流：搜商品→查双百→type/素材（不再是纯本地查询）
 curLhs=v.split(/[,\s，]+/).filter(Boolean);
 await classify();
}
function demo(){ $('#lh').value='DTM06-12SA'; go(); }

function pickLhCol(head){ for(const h of head){ if(/料号|型号|part|mpn|sku/i.test(h)&&!/价|名/.test(h)) return head.indexOf(h); } return head.findIndex(h=>/料号/.test(h)); }
$('#drop').onclick=()=>{ const f=document.createElement('input'); f.type='file';
 f.onchange=()=>handleFile(f.files[0]); f.click(); };
['dragover','drop'].forEach(ev=>$('#drop').addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.toggle('over',ev==='dragover');}));
$('#drop').addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f)handleFile(f); });
function handleFile(f){
 const name=f.name.toLowerCase(); $('#cur').textContent='读文件 '+f.name+' …';
 if(name.endsWith('.csv')){ const rd=new FileReader(); rd.onload=()=>parseCSV(rd.result); rd.readAsText(f); }
 else if(name.endsWith('.xls')||name.endsWith('.xlsx')){ const rd=new FileReader(); rd.onload=()=>{ const wb=XLSX.read(new Uint8Array(rd.result),{type:'array'}); const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1}); parseRows(rows); }; rd.readAsArrayBuffer(f); }
 else $('#cur').textContent='不支持的格式：'+f.name;
}
function parseCSV(text){ const rows=text.split(/\r?\n/).map(l=>l.split(',')).filter(r=>r.join('').trim()); parseRows(rows); }
function parseRows(rows){
 if(!rows.length) return; const ci=pickLhCol(rows[0]);
 const lhs=rows.slice(1).map(r=>(r[ci]||'').trim()).filter(x=>x&&!/料号|合计|总计/.test(x));
 $('#cur').textContent='识别到 '+lhs.length+' 个料号（列：'+rows[0][ci]+'）';
 scan(lhs.slice(0,30)); // 本版单批最多 30，防拖垮
}
// 跑批进度（读 tg-monitor 的 progress.json——脚本侧单份；running 且 updated 距今 <120s 才算在跑）
let _bpTimer=null;
const _BPK={'推广':'推广','上品':'上品','优化':'老品优化'};
function _bpT(s){ const v=Date.parse(String(s||'').replace(' ','T')); return isNaN(v)?null:v; }
async function loadBatchProg(){
 let alive=false;
 try{
  const d=await fetch('/api/plg/tg-monitor/progress').then(r=>r.json());
  const p=d&&d.progress, el=document.getElementById('batchprog');
  if(!p||!p.total){ el.style.display='none'; }
  else{
   el.style.display='flex';
   const age=(_bpT(p.updated)!=null)?Math.floor((Date.now()-_bpT(p.updated))/1000):1e9;
   alive=!!p.running&&age<120;
   if(!alive&&age>1800){ el.style.display='none'; return; }
   const st=_bpT(p.started), up=_bpT(p.updated);
   const endRef=alive?Date.now():((up!=null)?up:Date.now());
   const mins=(st!=null)?Math.max(0,Math.round((endRef-st)/60000)):0;
   let s='\u{1F680} '+(_BPK[p.kind]||p.kind||'批')+' '+(p.done||0)+'/'+(p.total||0);
   if(p.current) s+=' \u00b7 \u5f53\u524d '+p.current;
   s+=' \u00b7 \u6210\u529f'+(p.ok||0)+' \u8df3\u8fc7'+(p.skip||0)+' \u5931\u8d25'+(p.fail||0)+' \u00b7 \u5df2\u8dd1 '+mins+' \u5206\u949f';
   if(p.running&&!alive) s+=' \u00b7 \u7591\u4f3c\u4e2d\u65ad\uff08\u6700\u540e\u66f4\u65b0 '+String(p.updated||'').slice(11)+'\uff09';
   else if(!p.running) s+=' \u00b7 \u5df2\u7ed3\u675f';
   el.textContent=s;
  }
 }catch(e){}
 clearTimeout(_bpTimer); _bpTimer=setTimeout(loadBatchProg, alive?3000:10000);
}
loadBatchProg();
</script>

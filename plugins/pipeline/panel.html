<!doctype html><meta charset="utf-8">
<style>
input, textarea, select { background:var(--card,#fffdf7); color:var(--text,#333); }
input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus {
 -webkit-box-shadow:0 0 0 30px var(--card,#fffdf7) inset !important;
 -webkit-text-fill-color:var(--text,#333) !important; }
input::placeholder { color:var(--text-m,#999); }

 body{font-family:inherit;margin:0;background:transparent;color:var(--text,#333)}
 .bar{display:flex;gap:8px;margin-bottom:10px}
 input[type=text]{flex:1;border:.5px solid var(--border,#ccc);border-radius:6px;padding:7px 10px;font-size:13px;background:#fffdf7}
 button{border:0;border-radius:6px;padding:7px 14px;font-size:13px;cursor:pointer;background:var(--accent,#4a7cf7);color:#fff}
 button.ghost{background:transparent;border:.5px solid var(--border,#ccc);color:var(--text,#333)}
 .drop{border:2px dashed var(--border,#aaa);border-radius:10px;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--text-l,#888);font-size:14px;margin-bottom:10px;cursor:pointer;background:#fffdf7;gap:6px;font-weight:600}
 .drop.over{border-color:var(--accent,#4a7cf7);background:rgba(74,124,247,.06)}
 .cur{font-size:12px;color:var(--text-l,#888);margin-bottom:4px;min-height:16px}
 .stage{display:flex;align-items:center;gap:6px;padding:7px 10px;border:.5px solid var(--border,#ddd);border-radius:8px;background:var(--bg-card,#fbf9f4);margin-bottom:6px;flex-wrap:wrap}
 .sdot{width:9px;height:9px;border-radius:50%;background:#ddd;flex:none;margin:0 2px}
 .sdot.on{background:#f6b93b;box-shadow:0 0 5px rgba(246,185,59,.7)}
 .sdot.done{background:#2a7a3a}
 .sdot.fail{background:#d33}
 .stagel{font-size:12px;color:var(--text,#333);margin:0 2px}
 .stagenm{font-size:12px;font-weight:600;color:var(--accent,#4a7cf7);margin-right:10px;min-width:80px}
 .sitem{display:inline-flex;align-items:center;gap:2px;cursor:pointer;padding:2px 6px;border-radius:6px;border:.5px solid transparent}
 .sitem:hover{background:rgba(74,124,247,.08);border-color:var(--border,#ddd)}
 .sitem.pending{opacity:.45}
 .sitem.pending:hover{opacity:.85}
 .sitem.now{border-color:var(--accent,#4a7cf7);background:rgba(74,124,247,.10)}
 .sarrow{color:var(--border,#ccc);font-size:11px;margin:0 1px}
 table{border-collapse:collapse;width:100%;font-size:12px}
 th,td{border-bottom:.5px solid var(--border,#eee);padding:5px 6px;text-align:left;white-space:nowrap}
 th{position:sticky;top:0;background:var(--bg-card,#fbf9f4);font-weight:600;color:var(--text-l,#666)}
 tr.doing td{background:rgba(74,124,247,.08);outline:1.5px solid var(--accent,#4a7cf7)}
 td.missing{color:#d33}
 td.ok{color:#2a7a3a}
 .pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;border:.5px solid}
 .pill.y{border-color:#d33;color:#d33}
 .pill.n{border-color:#2a7a3a;color:#2a7a3a}
 .batchprog{display:none;align-items:center;gap:8px;padding:5px 10px;border:.5px solid var(--accent,#4a7cf7);border-radius:6px;margin-bottom:6px;font-size:12px;color:var(--accent,#4a7cf7);background:rgba(74,124,247,.06)}

 /* ── 分区与节奏：每块一个卡，8px 竖节奏，标题行打头 ── */
 .phead{display:flex;align-items:center;gap:10px;padding:0 2px 8px}
 .ptitle{font-size:12.5px;font-weight:600;color:var(--text,#333)}
 .pdim{font-size:11.5px;color:var(--text-m,#888)}
 div:has(> #acctbar){margin-bottom:0 !important}
 .bar{background:var(--card,#fffdf7);border:.5px solid var(--border,#ddd);border-radius:var(--r,8px);
      padding:10px 12px;margin-bottom:8px;gap:8px 10px;align-items:center;flex-wrap:wrap}
 .bar::before{content:attr(data-zone);font-size:11.5px;font-weight:600;color:var(--text-m,#888);
      margin-right:2px;padding-right:10px;border-right:.5px solid var(--border,#eee)}
 .bar input[type=text]{min-width:200px}
 .bar label{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:12px;color:var(--text-l,#888)}
 .bar select{font-size:12px;border:.5px solid var(--border,#ccc);border-radius:6px;padding:6px 8px;background:#fffdf7;color:var(--text,#333)}
 .stage{background:var(--card,#fffdf7);border-color:var(--border,#ddd);padding:10px 12px;margin-bottom:8px}
 .cur{margin-bottom:6px}
 #batchprog{margin-bottom:8px}
 #repairBar{margin-bottom:8px}
 div:has(> #tb){background:var(--card,#fffdf7);border:.5px solid var(--border,#ddd);
      border-radius:var(--r,8px);padding:0;overflow:auto;max-height:52vh;margin-bottom:8px}
 #tb th:first-child,#tb td:first-child{padding-left:12px}
 #tb th:last-child,#tb td:last-child{padding-right:12px}
 #tb tbody tr:hover td{background:rgba(74,124,247,.05)}
 .drop{min-height:96px;margin-bottom:8px;border-radius:var(--r,8px)}
 #catSt{margin:0 0 4px 2px !important}
 #fieldbar{margin:0 0 8px 2px !important}
/* 引导条：一眼看出「现在在哪 / 下一步点哪个」 */
#guide{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px;padding:9px 12px;border-radius:9px;
  background:linear-gradient(90deg,#f3f6ff,#fbfdff);border:.5px solid #d6e0f5;font-size:12.5px;color:#3a4a63}
#guide .gStep{font-weight:600;color:#2a5cd0;white-space:nowrap}
#guide .gTip{color:#5a6b85}
#guide .gAct{background:#2a5cd0;color:#fff;border:0;border-radius:7px;padding:5px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap}
#guide .gAct:hover{background:#1f49ab}
#guide .gAct.ghost{background:#fff;color:#2a5cd0;border:.5px solid #b9c8e6}
#guide .gAct.ghost:hover{background:#eef3ff}
#guide.warn{background:linear-gradient(90deg,#fff7e8,#fffdf7);border-color:#f0dfb8;color:#7a5a10}
#guide.warn .gStep{color:#a86a00}
#guide.warn .gAct{background:#c98a00}
#guide.warn .gAct:hover{background:#a86a00}
</style>

<div class="phead"><span class="ptitle">流水线 · 上品 / 优化 / 推广</span><span id="acctbar" class="pdim">账号 —</span></div><script>
(async function(){
  try{
    var r = await fetch('/api/plg/pipeline/acct').then(function(x){return x.json();});

    if(el && r && r.account) el.textContent = '账号 ' + (r.account.name || '未命名') + (r.account.member_id ? (' \u00b7 ' + r.account.member_id) : '');

})();
</script>

  <button class="ghost" onclick="demo()">试填</button>

  <input type="number" id="bn" min="1" max="200" value="30" title="批量阶段一次跑多少个品：切小便于盯进度、也少招风控（查询/属性/素材/整理/上品/推广都按它切批）" style="width:64px;border:.5px solid var(--border,#ccc);border-radius:6px;padding:4px 6px;font-size:13px">
  <label style="font-size:12px;color:var(--text-l,#999);margin-left:6px" title="上品/优化：只走流程不提交，用来试跑"><input type="checkbox" id="dryChk"> 预演不提交</label>
  <label style="font-size:12px;color:var(--text-l,#999);margin-left:6px" title="素材：把已生成的封面/白底/详情/视频重做一遗（目录里有旧脏图、水印图时勾）"><input type="checkbox" id="forceChk"> 重做素材</label>
  <label style="font-size:12px;color:var(--text-l,#999);margin-left:6px" title="素材：目录里没图时，自己去图库/立创找图，再走 AI 白底→详情/视频/规格书（缺图的品勾）"><input type="checkbox" id="aiChk"> AI 找图补全</label>
</div>

  <span style="font-size:12px;color:var(--text-l,#888);white-space:nowrap">类目</span>
  <input id="catKw" type="text" placeholder="打类目名，如 连接器 / 保险丝 / 文胸内衣" style="max-width:240px">
  <button class="ghost" onclick="catSearch()">🔍 搜类目</button>
  <select id="catSel" style="flex:1;min-width:220px;font-size:12px;border:.5px solid var(--border,#ccc);border-radius:6px;padding:6px;background:#fffdf7"><option value="">（先搜类目）</option></select>
  <button class="ghost" onclick="catSave()">记住类目</button>
  <span style="flex:1"></span>
  <span style="font-size:12px;color:var(--text-l,#888);white-space:nowrap">上品/优化实现</span>
  <select id="pubImpl" onchange="pubImplSave()" style="font-size:12px;border:.5px solid var(--border,#ccc);border-radius:6px;padding:6px;background:#fffdf7">
    <option value="script">脚本（UI全流程·可提交）</option>
    <option value="api">接口（只出计划+照镜子·不提交）</option>
  </select>
  <label style="font-size:12px;color:var(--text-l,#999)" title="仅接口版：把改后的表单发给 previewDraftSubmit.htm 照一次镜子（非提交，不改商品）"><input type="checkbox" id="mirrorChk"> 照镜子</label>
</div>

 <span style="font-size:12px;color:var(--text-l,#999)">阶段加载中…</span></span></div>

<thead><tr><th>料号</th><th>类型</th><th>ID</th><th>素材</th><th>人工审核</th><th>上品/优化</th><th>推广</th></tr></thead>

<script>
const $=s=>document.querySelector(s);
const P="/api/plg/pipeline/";
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const cell=(v,cls='')=>'<td class="'+cls+'">'+esc(v)+'</td>';

var curItems=[];
function curHasAudit(items){
 try{
  var f=0,h=0; items.forEach(function(x){ var a=(x.audit||''); if(a.match(/送修/))f++; if(a.match(/换源/))h++; });
  var rb=document.getElementById('rpBtn'), sb=document.getElementById('ssBtn');
  if(rb) rb.style.display=f?'':'none';
  if(sb) sb.style.display=h?'':'none';
 }catch(e){}
}
function render(items){ curHasAudit(items);
 curItems=items; const tb=$('#tb tbody');
 tb.innerHTML=items.map((it,i)=>
  '<tr id="r'+i+'" style="cursor:pointer" onclick="adStartFrom('+i+')">'+cell(it.lh)+typeCell(it.type)+cell(it.id||'—')
  +(it.素材==='齐'?cell('齐','ok'):cell(it.素材,'missing'))
  +cell(it.审核||(it['上次审核']?('上次:'+it['上次审核']):'待审'))+cell(it['上品/优化']||'—')+cell(it.推广||'—')+'</tr>').join('');
 if(!items.length) tb.innerHTML='<tr><td colspan=7 style="color:#aaa;text-align:center;padding:16px">空——拖入清单或输料号</td></tr>';
}
function highlight(i){ document.querySelectorAll('#tb tr').forEach(r=>r.classList.remove('doing'));
 const r=document.getElementById('r'+i); if(r)r.classList.add('doing'); }

/* ── 阶段条（0915 框架 · 数据驱动：定义从后端 /stages 拉，明天填血肉只动后端）── */
var STAGES=[];                      // [{key,label,ready,desc}]
function idxOf(k){ for(var i=0;i<STAGES.length;i++){ if(STAGES[i].key===k) return i; } return -1; }
async function loadStages(){
 try{
  var d=await fetch(P+'stages').then(function(r){return r.json();});
  if(d&&d.ok&&d.stages&&d.stages.length){ STAGES=d.stages; renderStages(); }
 }catch(e){}
}
function renderStages(){
 var bar=document.getElementById('stageBar'); if(!bar) return;
 bar.innerHTML=STAGES.map(function(s,i){
  return '<span class="sitem'+(s.ready?'':' pending')+'" id="si'+i+'" title="'+esc((s.ready?'':'【未接线】')+(s.desc||''))+'" onclick="runStage('+i+')">'
   +'<span class="sdot" id="s'+i+'"></span><span class="stagel">'+esc(s.label)+'</span></span>';
 }).join('<span class="sarrow">\u2192</span>');
}
var STAGE_ST={};   /* 各阶段状态：idle/on/done/fail —— 引导条靠它算「下一步」 */
var STAGE_HINT={
 'query':'分流完就分好了两类。「老品-需优化」和「新品-待上架」各走各的路',
 'attribute':'补必填属性——老品要双百就靠这一步（选对分区 + 填全必填）',
 'material':'素材这关：缺图的品勾「AI 找图补全」；目录里有旧脏图/水印图的勾「重做素材」',
 'organize':'整理素材目录（把图归位、挑主图）',
 'audit':'人工审核：逐张标 放行 / 送修 / 换源；标完点「🛠 送修处理」跑在途的',
 'publish':'要真上架就别勾「预演不提交」；先试跑一遍就勾上（不提交）',
 'promote':'推广：等账户充值到账再跑'
};
function renderGuide(){
 var g=document.getElementById('guide'); if(!g) return;
 var cur=null, next=null;
 for(var i=0;i<STAGES.length;i++){
  var st=STAGE_ST[STAGES[i].key]||'idle';
  if(!cur && (st==='on'||st==='fail')) cur=i;
  if(!next && st!=='done') next=i;
 }
 if(cur!==null && STAGE_ST[STAGES[cur].key]==='fail'){
  g.className='warn';
  g.innerHTML='<span class="gStep">⚠ 卡在「'+esc(STAGES[cur].label)+'」</span><span class="gTip">看下方红字原因（已翻译成人话），修完再点一次</span>';
  return;
 }
 if(cur!==null){
  g.className='';
  g.innerHTML='<span class="gStep">⏳ 正在跑「'+esc(STAGES[cur].label)+'」</span><span class="gTip">等进度条变绿；中途想停就点上面的「⏹ 停止」或刷新</span>';
  return;
 }
 if(next===null){
  g.className='';
  g.innerHTML='<span class="gStep">✅ 本批走完了</span><span class="gTip">想再接一批：换个清单重新拖进来</span>';
  return;
 }
 var s=STAGES[next];
 g.className='';
 g.innerHTML='<span class="gStep">下一步 '+esc(s.label)+'</span><span class="gTip">'+esc(STAGE_HINT[s.key]||s.desc||'')+'</span>'
   +'<button class="gAct" onclick="runStage('+next+')">▶ 直接跑这一步</button>';
}
/* 报错说人话：技术文案 → 能看懂的一句话 */
var ERR_MAP=[
 ['变化点与目标不符','改了库存但价格没变（本来就一样），已拦下——线上没动'],
 ['不许降价','这个品的现价高于你要改的价，系统拦住了（怕误降价）。真要降得临时开闸'],
 ['无参考图','这个品没有可用的参考图（素材目录空、图库也没搜到）——先补图'],
 ['未出图','AI 那边没返回图（服务端忙），重试一次就好'],
 ['服务器繁忙','小云雀服务端在排队，不是脚本的问题——过会儿重试'],
 ['服务器繁忙 ret','小云雀服务端在排队，重试一次'],
 ['缺主图素材','这个品缺主图素材（没有白底图/封面），上品会跳过——先补素材'],
 ['商品未命中','在售列表里找不到这个 ID——是不是填错 ID 了'],
 ['验证码','淘宝弹了验证码，需要人工过一下码'],
 ['Target page','浏览器被别的任务占着（同账号只能开一个），等它跑完再试'],
 ['Sync API inside','脚本内部起浏览器的方式错了（这个我会修）'],
 ['Request context disposed','浏览器中途关了——重试']
];
function humanErr(m){
 var t=String(m==null?'':m);
 for(var i=0;i<ERR_MAP.length;i++){ if(t.indexOf(ERR_MAP[i][0])>=0) return ERR_MAP[i][1]; }
 return t;
}
function setStage(idx,st,nm){ if(idx>=0&&idx<STAGES.length){ STAGE_ST[STAGES[idx].key]=st; const d=document.getElementById('s'+idx); if(d) d.className='sdot '+st;
  const it=document.getElementById('si'+idx); if(it) it.className='sitem'+(STAGES[idx].ready?'':' pending')+(st==='on'?' now':''); renderGuide(); }
 $('#stnm').textContent=nm||(((STAGES[idx]||{}).label||'')+'中'); }
function setStageKey(k,st,nm){ setStage(idxOf(k),st,nm); }
/* 阶段入口：点阶段条上的格子 = 跑该阶段（未接线的只提示，不动任何真进程） */
async function runStage(i){
 var s=STAGES[i]; if(!s) return;
 if(!s.ready){ $('#cur').textContent='\u23f3「'+s.label+'」还没接血肉 —— 计划调用：'+s.desc; return; }
 var arr=curLhsIndexed();
 if(!arr.length){ alert('先输料号或拖入清单'); return; }
 setStage(i,'on',s.label);
 var _dry=document.getElementById('dryChk'), _fo=document.getElementById('forceChk');
 var _mi=document.getElementById('mirrorChk');
 var _ai=document.getElementById('aiChk');
 var _extra=((_dry&&_dry.checked)?'&dry=1':'')+((_fo&&_fo.checked)?'&force=1':'')+((_mi&&_mi.checked)?'&mirror=1':'')+((s.key==='material'&&_ai&&_ai.checked)?'&ai=1':'');
 var chs=chunkLhs(arr,batchN()), items=[], msgs=[], allok=true;
 for(var ci=0;ci<chs.length;ci++){
  if(chs.length>1) $('#cur').textContent='「'+s.label+'」第 '+(ci+1)+'/'+chs.length+' 批（共 '+arr.length+' 品，每批 '+chs[ci].length+'）…';
  var d=await fetch(P+'run?stage='+encodeURIComponent(s.key)+'&lhs='+encodeURIComponent(chs[ci].join(','))+_extra).then(function(r){return r.json();});
  if(d.items) items=items.concat(d.items);
  if(d.msg) msgs.push(d.msg);
  if(!d.ok){ allok=false; if(d.error) msgs.push(d.error); }
 }
 if(items.length) render(items);
 if(!allok){ setStage(i,'fail',s.label+' \u2717'); $('#cur').textContent='\u2717 '+humanErr(msgs.join(' ／ ')); return; }
 setStage(i,'done',s.label+' ok');
 $('#cur').textContent='「'+s.label+'」完成（'+arr.length+' 品）'+(msgs.length?('：'+msgs.join(' ／ ')):'');
}
loadStages();
/* ── 类目（面板打人话 → 脚本自己搜 catId；命中缓存秒回）+ 上品/优化实现开关 ── */
function _catSt(t){ var e=document.getElementById('catSt'); if(e) e.textContent=t; }
async function loadSettings(){
 try{
  var d=await fetch(P+'settings').then(function(r){return r.json();});
  if(!d||!d.ok) return;
  var s=d.settings||{}, c=s.category||{};

function repairPoll(){

   if(p.current) s+=' \u00b7 \u5f53\u524d '+p.current;
   s+=' \u00b7 \u6210\u529f'+(p.ok||0)+' \u8df3\u8fc7'+(p.skip||0)+' \u5931\u8d25'+(p.fail||0)+' \u00b7 \u5df2\u8dd1 '+mins+' \u5206\u949f';
   if(p.running&&!alive) s+=' \u00b7 \u7591\u4f3c\u4e2d\u65ad\uff08\u6700\u540e\u66f4\u65b0 '+String(p.updated||'').slice(11)+'\uff09';
   else if(!p.running) s+=' \u00b7 \u5df2\u7ed3\u675f';
   el.textContent=s;
  }
 }catch(e){}
 clearTimeout(_bpTimer); _bpTimer=setTimeout(loadBatchProg, alive?3000:10000);
}
loadBatchProg();
</script>
